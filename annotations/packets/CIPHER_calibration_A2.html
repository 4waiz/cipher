 utilities/components specifics"}, {"path": "AGENTS.md", "line": 192, "text": "- [libs/connectors/AGENTS.md](./libs/connectors/AGENTS.md) - Microsoft 365 and Google Workspace viewers"}, {"path": "AGENTS.md", "line": 193, "text": "- [libs/renderer/AGENTS.md](./libs/renderer/AGENTS.md) - Visualization components specifics"}], "full_files": {"libs/sdk/AGENTS.md": "# AGENTS.md - @semoss/sdk\n\nThis document provides context for AI coding assistants working with the SEMOSS core SDK.\n\n> **Inherits from:** [../../AGENTS.md](../../AGENTS.md) for code style, file-naming, package\n> structure, commit messages, Biome config, and Node/pnpm requirements.\n\n## Overview\n\n`@semoss/sdk` is the core client SDK for talking to a SEMOSS backend (pixel/API calls, insight\nstate, environment config). It has framework-independent stores and optional **React**\nbindings on a subpath; this is not a blanket Node/SSR compatibility guarantee.\nIt has **no internal runtime workspace dependencies**. Treat its published public\nsurface as stable and versioned.\n\n## Build System\n\n- **Bundler**: Vite 8 library mode (Rolldown) → ES modules (`dist/index.mjs`) with types in `dist/types/` (via unplugin-dts).\n- Two entry points via `exports`:\n\n| Import | Source entry | Published JavaScript |\n|--------|--------------|----------------------|\n| `@semoss/sdk` | `src/index.ts` | `dist/index.mjs` |\n| `@semoss/sdk/react` | `src/js-frameworks/react/index.ts` | `dist/js-frameworks/react/index.mjs` |\n\nThe package also ships `skills/` via `files` and `npmSkills.publish.source` in\n[package.json](./package.json). Keep [the SDK chat guide](./skills/sdk-chat/SKILL.md)\nself-contained at that path for external consumers. The\n[flat repository skill](../../skills/sdk-chat.skill.md) routes to it; it is not a\nsecond API reference.\n\n### Commands\n\n| Command | Description |\n|---------|-------------|\n| `pnpm dev` | Watch mode (`vite build --watch`) |\n| `pnpm build` | Production build |\n| `pnpm build:dev` | Development build |\n| `pnpm test` | Run tests once (Vitest) |\n| `pnpm test:watch` | Tests in watch mode |\n| `pnpm test:coverage` | Coverage report |\n\n## Structure\n\nFollows the standard `src/` layout from the root AGENTS.md (a library, so no `pages/` or\nrouter):\n\n| Folder / file | Purpose |\n|---------------|---------|\n| `api/` | API / pixel call implementations |\n| `stores/` | State (e.g. `InsightStore`, exported as `Insight`) |\n| `utility/` | Utility functions |\n| `js-frameworks/react/` | React binding (published as `@semoss/sdk/react`) |\n| `constants.ts` | Shared constants |\n| `env.ts` | Environment configuration |\n| `listener.ts` | Side-effect listener imported at the top of `index.ts` |\n| `types.ts` | Shared TypeScript types |\n| `index.ts` | Main barrel |\n\n## Agent Guardrails\n\n### Do Not Modify\n\n- **`dist/`** — build output, regenerated by Vite.\n\n### Be Cautious With\n\n- **`src/index.ts` and `src/js-frameworks/react`** — the public API. This package is published\n  and consumed by every other package; breaking changes ripple everywhere.\n- **`env.ts` / `listener.ts`** — environment wiring and the side-effect import in `index.ts`.\n- **`vite.config.ts`** — build configuration and the two entry points.\n\n### When Adding to the SDK\n\n1. Keep framework-agnostic logic out of `js-frameworks/` — React-only code belongs under\n   `js-frameworks/react`.\n2. Export new public API from `src/index.ts` (core) or the React entry as appropriate.\n3. Verify both entries build:\n   ```bash\n   pnpm --filter @semoss/sdk build\n   ```\n\n### Testing Changes\n\nFor SDK source changes, run the relevant tests first, then the package gates:\n\n```bash\npnpm --filter @semoss/sdk test\npnpm --filter @semoss/sdk build\n```\n\nFor documentation-only edits, check local links, skill metadata, package inclusion,\nand examples against source exports/types. Run focused tests for lifecycle claims;\ndo not present those checks as backend integration verification. Follow the\n[repository validation guidance](../../skills/react-standard.skill.md#validation),\nwith [biome.json](../../biome.json) as lint/formatting authority.\n\n## Chat and Agent Ownership\n\nLoad the [SDK chat guide](./skills/sdk-chat/SKILL.md) for API contracts, examples,\ntransport selection, lifecycle cleanup, and known gaps. Maintain those details\nthere instead of repeating them in AGENTS files.\n\nWhen changing an API, inspect its owning implementation and adjacent tests:\n\n- [Chat wrappers](./src/api/chat.ts) and [pixel transport](./src/api/base.ts).\n- [Agent wrappers](./src/api/agent.ts) and [AgentStore](./src/stores/agent/agent.store.ts).\n- [MCP wrappers](./src/api/mcp.ts): `runMcpTool` and `makeUserPixelMcp`.\n- [RoomStore](./src/stores/room/room.store.ts) and [shared types](./src/types.ts).\n- [Core exports](./src/index.ts) and [React exports](./src/js-frameworks/react/index.ts).\n\nUpdate the packaged guide with signature/behavior changes. Comments and mocked\ntests are not backend authority; retain its compatibility caveats until verified.\n\n## Session Logins\n\nThe SDK owns what the session is signed in to, so an app never tracks or caches it:\n\n- [`Logins`](./src/stores/logins/logins.store.ts) holds the session's logins for the whole\n  page, shared by every `InsightStore` and view. `InsightStore` fills it from the system config\n  when it loads. After a login it reads `/api/config` again, since the copy read while signed\n  out names no logins, and refills it from that, or from a fresh logins read when the config\n  cannot be read. On logout it only resets it, so views still on screen show the logins as\n  unknown rather than signed out.\n- A reset drops any read still in flight, so an answer for the old session never lands in the\n  new one. Provider keys are compared and sent in upper case, the way the backend lists and\n  signs them out.\n- `refresh` joins a read in flight and reuses one younger than 30 seconds; `useLogins()` reads\n  again when a view mounts and whenever the window regains focus.\n- `accountIds` is the user id of each login, from the config's `loginDetails`; the logins read\n  has no ids. A read drops the id of a login the session signed out of, and a login signed in to\n  since the config was read has none until the config is read again. Once logins are known, a\n  config only adds the id of a login that has none, and only when it names that login the same\n  way, so a config cached for an earlier session never replaces them. The client app seeds\n  `Logins` from its own config read, at start and after each login, and resets it on logout.\n- `connect` signs in to one more provider with a fresh popup (see `connectLogin` in\n  [`api/auth.ts`](./src/api/auth.ts)): a listed provider is signed out first, since the backend\n  keeps listing an expired token. Neither it nor `disconnect` ever signs out the session's own\n  login (`primaryLogin`), which would end the session or change whose it is.\n- Every sign in popup, `connectLogin` and the first login's `oauth`, waits through\n  `waitForSignInPopup`: the backend sends a finished popup to its configured `redirect`, which can\n  be another app or origin (a dev server's popup lands on the deployed client), where the popup\n  cannot be read. So besides watching the popup close or come back, it reads the login every two\n  seconds and closes the popup once it is there. `oauth` rejects when the popup ends without the\n  login rather than leaving the sign in waiting. Apps call the SDK's `oauth`; none keeps a copy.\n\n## Permission Batches\n\n[`api/access.ts`](./src/api/access.ts) holds Bulk Access Management's calls to the backend's\npermission batch endpoints, `/api/auth/permissionBatch`, or `/api/auth/admin/permissionBatch` when\na call's `admin` is true, where an admin can read and change anything:\n\n- `getResourcePermissions` (`getPermissions`) reads the people and teams who can use a project or\n  engine and what the signed in user may change (`allowedPermissionChanges`). `getTeamPeople`\n  reads a custom team's members or managers through the same endpoint.\n- `validatePermissionBatches` and `savePermissionBatches` post the batches as JSON in the\n  `batches` form field. Validating returns one result per batch, in the order sent, and each\n  change's result carries its index in its batch. Saving saves every change of every batch, or\n  none.\n- `getPermissionsToCopy` reads the people to copy from one project, engine or team into another,\n  with their access on both. `getEffectivePermissions` reads everyone who can use a project or\n  engine, and where their access comes from.\n\nEach call checks the response's shape and throws when it is not what the call reads. Lists of\npeople leave out rows without an id, login type or known level; validation results are never\nleft out, since they are matched to the batches by position.\n\n## Model Usage Limits\n\nA model's usage limits share one shape, `ModelUsageLimit` (`unlimited`, and `rules` of\n`ModelUsageLimitRule`: `metric`, `amount`, `window`, `windowLength`, `counts`), defined in\n[`api/access.ts`](./src/api/access.ts). Null is no limit defined, everywhere. Every rule has an\namount: cost amounts are millionths of a US dollar and compute time is milliseconds.\n`readModelUsageLimit` reads one from any response, as an object or a JSON string; the backend\nleaves out null fields, so a missing limit is null, a rule with no amount is left out, and a limit\nwith no rules that is not Unlimited is null too.\n\n- **Window lengths.** `windowLength` is how many minutes (1 to 59) or hours (1 to 24) a `MINUTE`\n  or `HOUR` rule's window spans, such as every 10 minutes. Missing or null means 1, so every\n  reader of rules (limits, Effective Permissions' rules and the path's `UsageLimitRuleUsage`)\n  keeps it only when it is a whole number above 1 on a minute or hour window, and a rule sends it\n  only when it is more than 1.\n\n- **Grants.** `PermissionGrant.usageLimit` is a model grant's limit. A `ModelLimitChange` (`PUBLIC` or `MODEL`\n  subject, `CHANGE` only, `to: { usageLimit }`) changes a model's public use limit or its total.\n- **Reads.** `getResourcePermissions` adds a model's `publicUse`, `modelTotal`,\n  `costLimitsAvailable` and `price`, and `allowedPermissionChanges.limitLevels` and\n  `canChangeModelLimits`. Only a model's owners, and admins in admin mode, set usage limits: they\n  get every level in `limitLevels` and `canChangeModelLimits` true, and everyone else gets none\n  and false. `getEffectivePermissions` adds each person's `usage` (who their calls are\n  billed to), `publicUse`, `ceilings` and each provider team's `usageLimit`.\n- **How limits apply to one person.** `getUsageLimitPath(engineId, person, admin)` (the model's\n  editors and owners, or admins) and `getMyUsageLimitPath(engineId)` (the signed in person) read a\n  `UsageLimitPath`: the ceilings, then each source in order, as `UsageLimitPathStep`s whose rules\n  are `UsageLimitRuleUsage` with `used` and `resetsAt` in UTC. Outside admin mode the backend\n  hides the rules of someone else's `ALL_MODELS` and `PLATFORM` steps: such a step comes with no\n  rules and `rulesHidden` true (false when not sent), and a team step may come without its\n  `teamTotal`, read as null.\n- **Defaults and totals.** [`api/model-usage.ts`](./src/api/model-usage.ts) holds the admin-only\n  `getPlatformDefaultLimit`, `setPlatformDefaultLimit`, `getTeamTotalLimit` and\n  `setTeamTotalLimit` (`/api/auth/admin/modelUsage`). Setting null removes the limit. The set\n  calls resolve with the limit the backend saved, read from its `{ usageLimit }` answer, and\n  reject when the save fails.\n- **The engine user endpoints.** `PostUser.usageLimit` carries a model member's limit through\n  `addEngineUserPermissions` and `editEngineUserPermissions`, and `getEngineUsers` reads each\n  model member's `usage_limit`, sent as an object or a JSON string.\n", "packages/browser-automation/AGENTS.md": "# AGENTS.md - @semoss/browser-automation\n\nThis document provides context for AI coding assistants working with the SEMOSS Playwright\nbrowser sockets harness.\n\n> **Inherits from:** [root AGENTS.md](../../AGENTS.md). Load the applicable\n> [root skills](../../skills/README.md), including the [React standard](../../skills/react-standard.skill.md).\n\n## Overview\n\n`@semoss/browser-automation` is a **private** Vite harness that drives a browser over\nsockets for Playwright/automation scenarios and exposes a SEMOSS MCP surface. It depends on\n`@semoss/sdk` and `@semoss/ui`.\n\n## Build System\n\n- **Bundler**: Vite 8 + React 19\n- **Styling**: Tailwind CSS v4\n\n### Commands\n\n| Command | Description |\n|---------|-------------|\n| `pnpm dev` | Start dev server |\n| `pnpm build` | Production build |\n| `pnpm build:dev` | Development build |\n| `pnpm type-check` | `tsc --noEmit` type check |\n| `pnpm lint` | Declared ESLint command; missing configuration (see below) |\n| `pnpm test` | Vitest (`--passWithNoTests`; success may mean no tests ran) |\n| `pnpm preview` | Preview the production build |\n\nRun these from `packages/browser-automation`, or use\n`pnpm --filter @semoss/browser-automation <command>`.\n\n### Linting\n\nFollow the [React validation guidance](../../skills/react-standard.skill.md#validation).\nThe manifest declares `lint: eslint .`, but this package has no `eslint.config.js` and no\nrepository-root config to inherit. Treat ESLint validation as blocked until the package\nconfiguration is repaired in a separately authorized change; do not report it as passing.\n\n## Structure\n\nThe existing layout is below. New application features follow the\n[React architecture policy](../../skills/react-standard.skill.md#architecture-and-exports);\nexisting folders are not an implicit migration task.\n\n| Folder / file | Purpose |\n|---------------|---------|\n| `src/components/` | Components (one per file) |\n| `src/hooks/` | React hooks (`use-<name>.ts`) |\n| `src/domain/` | Domain logic for the harness |\n| `src/semoss/` | SEMOSS integration glue |\n| `src/types/` | TypeScript types (`<name>.types.ts`) |\n| `src/App.tsx`, `src/main.tsx`, `src/index.css` | App entry files |\n| `mcp/` | MCP configuration (`pixel_mcp.json`) |\n\n## Design-System Notes\n\nFollow the root [Design System & Styling](../../AGENTS.md#design-system--styling) rules and\n[DESIGN.md](../../DESIGN.md).\n\n- **The local `@theme` block in `src/index.css` is deprecated** (`--color-canvas`,\n  `--color-surface`, `--color-ink`, `--color-accent`, `--color-danger`, …). It is a rival,\n  dark-only palette on top of `@semoss/ui/globals.css`. Do **not** add tokens to it or diverge\n  its values further; new UI uses the standard semantic classes (`bg-background`, `bg-card`,\n  `text-destructive`, …). When touching a file that uses the local classes\n  (`bg-surface-raised`, `border-line`, `text-danger`), migrate those usages to `@semoss/ui`\n  semantic classes. Full migration off the block is planned future work.\n\n## Agent Guardrails\n\n### Be Cautious With\n\n- **`vite.config.ts`** — dev server and build configuration.\n- **`mcp/pixel_mcp.json`** — the MCP surface definition.\n- **The declared `lint` script** — its missing configuration is a known validation gap.\n\n### Testing Changes\n\n```bash\npnpm --filter @semoss/browser-automation type-check\npnpm --filter @semoss/browser-automation build\n```\n\nReport the ESLint gap above separately from the checks that can run.\n\n## Generic utilities\n\nImport reusable helpers from `@semoss/utility/<category>`, a direct workspace dependency.\nFollow the [utility guide](../../libs/utility/AGENTS.md). Keep domain policy and\nUI behavior here, and preserve public compatibility adapters when moving helpers.\n"}}}, {"item_id": "c09c9ae", "practice": false, "task": "Make a small fix in `packages/browser-automation/src/vite-env.d.ts` and complete the checks this change requires before committing.", "t d](./libs/ui/AGENTS.md) - Component library specifics"}, {"path": "AGENTS.md", "line": 191, "text": "- [libs/shared/AGENTS.md](./libs/shared/AGENTS.md) - Shared utilities/components specifics"}, {"path": "AGENTS.md", "line": 192, "text": "- [libs/connectors/AGENTS.md](./libs/connectors/AGENTS.md) - Microsoft 365 and Google Workspace viewers"}, {"path": "AGENTS.md", "line": 193, "text": "- [libs/renderer/AGENTS.md](./libs/renderer/AGENTS.md) - Visualization components specifics"}], "full_files": {"AGENTS.md": "# AGENTS.md - SEMOSS Monorepo\n\nThis document provides context for AI coding assistants working with the SEMOSS monorepo.\n\n## Required Skill Routing (All Agents)\n\n**Before any task involving React files, every agent must read the full\n[React standard](./skills/react-standard.skill.md).** This is mandatory for all\nproviders and delegated agents when creating, editing, refactoring, debugging,\ninvestigating, planning changes to, or reviewing React code anywhere in the repo.\nIt covers `.tsx` and `.jsx` files, React components/hooks/context/providers in\n`.ts` or `.js` files, and React tests, stories, and examples. Task size and location\noutside `src/` do not waive this requirement.\n\n- Read the file itself; a link, skill listing, metadata, or summary is not a\n  substitute for its full contents. Do not rely on automatic skill discovery.\n- Apply its rules according to the work: React rules govern React code;\n  applicable language, architecture, compatibility, and validation rules govern\n  other work. Preserve documented exceptions and protected-file restrictions.\n- Unrelated documentation, configuration, scripts, and CI tasks do not require\n  this skill solely because they are in the repository.\n- After reading it, briefly identify `skills/react-standard.skill.md` in a\n  progress update; delegated agents must also identify it in their handoff.\n- Include this mandatory reading requirement in every delegated React task. Each\n  agent is responsible for loading the standard in its own context.\n- If context is compacted or lost, reload the standard before continuing unless\n  its full contents remain available. If the file cannot be read, report that\n  blocker before proceeding with React work.\n\nRead the owning package's `AGENTS.md` and use the [skill index](./skills/README.md)\nto load additional skills before the relevant work. Package guides and specialized\nskills supplement the standard; they do not waive reading it for React work.\n\n- [Accessibility](./skills/accessibility.skill.md): interactive UI and accessible behavior.\n- [Mobile development](./skills/mobile-development.skill.md): responsive and touch interfaces.\n- [React form builder](./skills/react-form-builder.skill.md): form fields, validation, and submission.\n- [SDK chat](./skills/sdk-chat.skill.md): rooms, messages, agent runs, approvals, and polling lifecycle.\n- [Design rulebook](./DESIGN.md): UI composition and styling.\n\nLint and formatting configuration lives in [biome.json](./biome.json).\n\n## Overview\n\nSEMOSS is a React-based analytics platform built as a pnpm monorepo with Turborepo orchestration.\n\n**Workspace Dependencies:**\n\nThese summaries include declared internal dependencies and peers. Package manifests\nand the owning guides define the exact public entry points and architectural boundaries.\n\nLibraries (`libs/*`, publishable):\n- `@semoss/utility` → Generic text, date, object, JSON, file, encoding, browser, and other functional helpers\n- `@semoss/sdk` → Core SDK (no internal dependencies)\n- `@semoss/ui` → Component library (no internal dependencies)\n- `@semoss/i18n` → Internationalization library (no internal dependencies)\n- `@semoss/shared` → Shared utilities (depends on i18n, sdk, ui, utility)\n- `@semoss/connectors` → Microsoft 365 and Google Workspace viewers (depends on i18n, sdk,\n  shared, ui, utility)\n- `@semoss/renderer` → Visualization components (depends on sdk, shared, ui)\n- `@semoss/workbench` → Multi-panel dock shell (depends on ui only — deliberately\n  domain-agnostic, so it can never import sdk, shared or i18n)\n- `@semoss/panels` → File panels for the dock (depends on i18n, sdk, shared, ui, utility, workbench)\n\nThe dock and the panels are two layers, in one direction:\n`@semoss/ui ← @semoss/workbench ← @semoss/panels → @semoss/shared → @semoss/sdk`.\n\nApplications (`packages/*`, not published):\n- `@semoss/client` → Main web application (depends on automation, i18n, panels, renderer, sdk, shared, terminal, ui, utility, workbench)\n- `@semoss/playground` → Chat (depends on connectors, i18n, panels, sdk, shared, ui, utility, workbench)\n- `@semoss/terminal` → Embedded terminal (depends on i18n, panels, sdk, shared, ui, workbench)\n- `@semoss/auditlog-package` → Audit log dashboard (depends on i18n, sdk, shared, ui)\n- `@semoss/automation` → Automation workspace app (depends on i18n, sdk, shared, ui, utility;\n  no client-store dependency)\n- `@semoss/cli` → CLI tooling (depends on sdk)\n- `@semoss/browser-automation` → Browser automation harness (depends on sdk, ui, utility)\n- `workshop-automation-extension` → Chrome extension (depends on sdk, ui, utility)\n\n**Every host that mounts a dock or a file panel** imports\n`@semoss/workbench/globals.css` and `@semoss/panels/globals.css`, and takes\n`aiSdkStubAlias` + `scopePptxViewerCssPlugin` from `@semoss/panels/vite`. See\n[libs/panels/AGENTS.md](./libs/panels/AGENTS.md#what-a-host-has-to-wire-up).\n\n**Every host that mounts a connector viewer** imports `@semoss/connectors/globals.css` and loads\nthe `connectors` i18n namespace. See\n[libs/connectors/AGENTS.md](./libs/connectors/AGENTS.md#what-a-host-has-to-wire-up).\n\n## Workspace Structure\n\n```\nsemoss/\n├── libs/           # Shared libraries (publishable)\n│   ├── utility/    # Generic cross-package utility functions\n│   ├── sdk/        # @semoss/sdk - Core SDK\n│   ├── ui/         # @semoss/ui - Component library\n│   ├── i18n/       # @semoss/i18n - Internationalization library\n│   ├── shared/     # @semoss/shared - Shared utilities\n│   ├── connectors/ # @semoss/connectors - Microsoft 365 and Google Workspace viewers\n│   ├── renderer/   # @semoss/renderer - Visualization components\n│   ├── workbench/  # @semoss/workbench - Multi-panel dock shell\n│   └── panels/     # @semoss/panels - File panels for the dock\n├── packages/       # Applications (not published)\n│   ├── client/                     # @semoss/client - Main web application\n│   ├── playground/                 # @semoss/playground - Chat\n│   ├── terminal/                   # @semoss/terminal - Embedded terminal app\n│   ├── auditlog/                   # @semoss/auditlog-package - Audit log dashboard\n│   ├── automation/                 # @semoss/automation - Automation workspace app\n│   ├── browser-automation/         # @semoss/browser-automation - Browser automation harness\n│   ├── chrome-extension/           # Chrome extension for browser automation\n│   ├── vscode-extension/           # semoss-vscode - VSCode extension\n│   └── cli/                        # @semoss/cli - CLI tooling\n├── skills/         # Provider-neutral *.skill.md guidance\n├── pnpm-workspace.yaml\n├── turbo.json\n└── biome.json\n```\n\n## Requirements\n\n- **Node.js**: >=24.4.0 <25 (see `.nvmrc`)\n- **pnpm**: ~10.13.0 (see `engines`; `packageManager` pins `pnpm@10.13.1`)\n\n## Build Commands\n\n| Command | Description |\n|---------|-------------|\n| `pnpm install` | Install all dependencies |\n| `pnpm dev` | Run all packages in dev mode |\n| `pnpm dev:client` | Run client with dependencies |\n| `pnpm dev:playground` | Run playground with dependencies |\n| `pnpm dev:terminal` | Run terminal with dependencies |\n| `pnpm build` | Production build all packages |\n| `pnpm build:dev` | Development build all packages |\n| `pnpm test` | Run all tests |\n| `pnpm test:watch` | Run tests in watch mode |\n| `pnpm check` | Run Biome linting/formatting check |\n| `pnpm fix` | Auto-fix Biome issues |\n\n## Design System & Styling\n\nSee [DESIGN.md](./DESIGN.md) and the [UI component catalog](./libs/ui/AGENTS.md).\n\n## Incremental Migration\n\nSee the React skill's [scope](./skills/react-standard.skill.md#authorities-and-scope) and\n[full-file review workflow](./skills/react-standard.skill.md#full-file-review-and-handoff).\n\n## Package Structure Conventions\n\nSee the React skill's [architecture](./skills/react-standard.skill.md#architecture-and-exports)\nand [naming conventions](./skills/react-standard.skill.md#types-and-naming), plus the owning\npackage guide below.\n\n## Agent Guardrails\n\n### Utility Ownership\n\n- Put reusable generic functions in `libs/utility`, grouped into flat files by function.\n  Import from the supported `@semoss/utility/<category>` subpath; use defining files\n  for imports within a package. See [the utility guide](./libs/utility/AGENTS.md).\n- Search individual files, nested functions, callbacks, and repeated expressions as\n  well as utility directories before adding helpers. Equivalent implementations can\n  use different names or syntax.\n- Keep feature policy, UI composition, SDK transport, and orchestration in their\n  owning packages. Preserve dependency boundaries: this does not authorize adding\n  utility dependencies to SDK, UI, i18n, workbench, or CLI.\n- Preserve whitespace, timezone, rounding, null/fallback, filename, and error behavior.\n  Use compatibility re-exports or small adapters for existing public contracts.\n- Prefer native operations over unnecessary wrappers. Do not add option-heavy\n  abstractions just to combine helpers with materially different contracts.\n\n### Do Not Modify\n- **`pnpm-lock.yaml`** - Managed by pnpm, never edit manually\n- **`pom.xml`** - Maven build configuration for deployment\n- **`*.local`** files - Local environment overrides (gitignored)\n- **`settings.xml`** - Maven settings for deployment\n\n### Be Cautious With\n- **`turbo.json`** - Affects build caching  source exports/types. Run focused tests for lifecycle claims;\ndo not present those checks as backend integration verification. Follow the\n[repository validation guidance](../../skills/react-standard.skill.md#validation),\nwith [biome.json](../../biome.json) as lint/formatting authority.\n", "packages/browser-automation/AGENTS.md": "# AGENTS.md - @semoss/browser-automation\n\nThis document provides context for AI coding assistants working with the SEMOSS Playwright\nbrowser sockets harness.\n\n> **Inherits from:** [root AGENTS.md](../../AGENTS.md). Load the applicable\n> [root skills](../../skills/README.md), including the [React standard](../../skills/react-standard.skill.md).\n\n## Overview\n\n`@semoss/browser-automation` is a **private** Vite harness that drives a browser over\nsockets for Playwright/automation scenarios and exposes a SEMOSS MCP surface. It depends on\n`@semoss/sdk` and `@semoss/ui`.\n\n## Build System\n\n- **Bundler**: Vite 8 + React 19\n- **Styling**: Tailwind CSS v4\n\n### Commands\n\n| Command | Description |\n|---------|-------------|\n| `pnpm dev` | Start dev server |\n| `pnpm build` | Production build |\n| `pnpm build:dev` | Development build |\n| `pnpm type-check` | `tsc --noEmit` type check |\n| `pnpm lint` | Declared ESLint command; missing configuration (see below) |\n| `pnpm test` | Vitest (`--passWithNoTests`; success may mean no tests ran) |\n| `pnpm preview` | Preview the production build |\n\nRun these from `packages/browser-automation`, or use\n`pnpm --filter @semoss/browser-automation <command>`.\n\n### Linting\n\nFollow the [React validation guidance](../../skills/react-standard.skill.md#validation).\nThe manifest declares `lint: eslint .`, but this package has no `eslint.config.js` and no\nrepository-root config to inherit. Treat ESLint validation as blocked until the package\nconfiguration is repaired in a separately authorized change; do not report it as passing.\n\n## Structure\n\nThe existing layout is below. New application features follow the\n[React architecture policy](../../skills/react-standard.skill.md#architecture-and-exports);\nexisting folders are not an implicit migration task.\n\n| Folder / file | Purpose |\n|---------------|---------|\n| `src/components/` | Components (one per file) |\n| `src/hooks/` | React hooks (`use-<name>.ts`) |\n| `src/domain/` | Domain logic for the harness |\n| `src/semoss/` | SEMOSS integration glue |\n| `src/types/` | TypeScript types (`<name>.types.ts`) |\n| `src/App.tsx`, `src/main.tsx`, `src/index.css` | App entry files |\n| `mcp/` | MCP configuration (`pixel_mcp.json`) |\n\n## Design-System Notes\n\nFollow the root [Design System & Styling](../../AGENTS.md#design-system--styling) rules and\n[DESIGN.md](../../DESIGN.md).\n\n- **The local `@theme` block in `src/index.css` is deprecated** (`--color-canvas`,\n  `--color-surface`, `--color-ink`, `--color-accent`, `--color-danger`, …). It is a rival,\n  dark-only palette on top of `@semoss/ui/globals.css`. Do **not** add tokens to it or diverge\n  its values further; new UI uses the standard semantic classes (`bg-background`, `bg-card`,\n  `text-destructive`, …). When touching a file that uses the local classes\n  (`bg-surface-raised`, `border-line`, `text-danger`), migrate those usages to `@semoss/ui`\n  semantic classes. Full migration off the block is planned future work.\n\n## Agent Guardrails\n\n### Be Cautious With\n\n- **`vite.config.ts`** — dev server and build configuration.\n- **`mcp/pixel_mcp.json`** — the MCP surface definition.\n- **The declared `lint` script** — its missing configuration is a known validation gap.\n\n### Testing Changes\n\n```bash\npnpm --filter @semoss/browser-automation type-check\npnpm --filter @semoss/browser-automation build\n```\n\nReport the ESLint gap above separately from the checks that can run.\n\n## Generic utilities\n\nImport reusable helpers from `@semoss/utility/<category>`, a direct workspace dependency.\nFollow the [utility guide](../../libs/utility/AGENTS.md). Keep domain policy and\nUI behavior here, and preserve public compatibility adapters when moving helpers.\n"}}}]}</script>
<script id="handbook" type="text/plain"># CIPHER annotation handbook (v1.0, frozen 2026-10-21)

You judge one case at a time. A case contains a concrete task that edits one target file, a repository revision, the
instruction-loading profile P1, and two instructions quoted verbatim from AGENTS.md files (with their file paths, line
numbers, headings, surrounding section and any scope or precedence statements found in the loaded files).

Judge only from the evidence shown. Do not look up the repository, do not use model output, and do not discuss cases with
the other annotator until both of you have exported your final file. Some cases contain researcher-constructed variations
of real files; label every case exactly as presented.

## Profile P1 (summary; the full text is shown in every case)

1. Only AGENTS.md files count.
2. The binding loaded set for the target is every AGENTS.md in the target's directory or an ancestor directory.
   AGENTS.md files elsewhere in the tree are not loaded for this target.
3. A loaded instruction is in force unless its own wording limits it (a condition such as "for Python code" or "when
   editing docs") and the task or target falls outside that limit.
4. If two loaded instructions impose incompatible requirements on the same decision, the more deeply nested file (closer
   to the target) wins. Ancestor instructions about other decisions stay in force.
5. Equal authority (same file, or same depth) is not resolved by order of appearance. Explicit priority statements in
   the files can establish a winner.

## Decision sequence

Answer these in order. Stop at the first step that determines the label.

1. **Evidence sufficiency.** Can you tell what each instruction requires and whether it applies? If a decisive fact is
   missing or an instruction is too vague to interpret (for example "follow the usual conventions" with no further
   content), choose **Insufficient evidence**.
2. **Initial joint applicability (before any priority).** Is each instruction in the loaded set for this target, and
   does its own condition cover this task and target? If at least one is not active, choose **Disjoint
   applicability**. Being outranked by a more specific file is *not* inactivity; that is decided in step 4.
3. **Same decision, incompatible requirements.** Do the two active instructions regulate the same decision in ways that
   cannot both be satisfied while doing this task? If they can be satisfied together (different decisions, a
   preference next to a requirement, one rule refining the other, duplicates), choose **Compatible**.
4. **Priority.** If they are incompatible: does P1 or an explicit statement in the files make one of them win? If yes,
   choose **Valid override**. If no (same file, same depth, no explicit priority), choose **Unresolved conflict**.

## Labels

| Label | Use when |
|---|---|
| Unresolved conflict | Both hard requirements are in force for the same decision, cannot both be satisfied, and nothing in P1 or the files picks a winner. |
| Valid override | Both apply before priority, they are incompatible, and P1 (deeper file) or an explicit statement resolves which one wins. |
| Disjoint applicability | Before priority, at least one instruction is inactive for this target or task (not in the loaded set, or excluded by its own condition). |
| Compatible | Everything in force can be satisfied together: different decisions, refinements, duplicates, or a non-binding preference next to a requirement. |
| Insufficient evidence | The material shown cannot establish meaning, applicability, or precedence well enough to choose another label. |

## Reading instructions carefully

- Preserve modality. "Prefer X" is not "never use Y". "Use tool A" does not by itself forbid tool B.
- Examples, code blocks and descriptions of how the project works are not automatically rules. Treat them as binding only
  if the wording makes them requirements.
- An instruction that limits itself ("for documentation-only edits", "in tests") is inactive outside that limit
  (Disjoint). An instruction that is merely outranked by a deeper file is still active (Override or Compatible).
- A task can involve several decisions. Ask whether the two instructions constrain the same one.
- Use the "missing context" flag if you think the packet left out something decisive. Still choose your best label.

## What to record

Label (required); whether each instruction is active for this target and task; whether they regulate the same decision;
the winner if any; the evidence lines you relied on (path:line); a one- or two-sentence reason (required); confidence;
and the missing-context flag. Do not change a submitted judgment after you have seen the other annotator's answers.

## Workflow

1. Calibration packet (authored practice items show the handbook answer after you save; real calibration items do not).
2. Discuss calibration disagreements with the team. The handbook is frozen after this step; changes are logged.
3. Evaluation packet: label independently, export JSON, send the file to the coordinator.
4. The adjudicator reviews only cases where the two labels differ, sees both judgments and reasons, and records a final
   label with a reason. Initial judgments are preserved.

const KEY = "cipher-annotation-" + P.packet_id;
let state = {responses:{}}, storageOk = true;
try { const s = localStorage.getItem(KEY); if (s) state = JSON.parse(s); localStorage.setItem(KEY + "-probe", "1"); }
catch (e) { storageOk = false; }
let cur = 0, t0 = performance.now();
const $ = (s, el=document) => el.querySelector(s);

function resp(id){ return state.responses[id] ||= {item_id:id, active_ms:0}; }

function dirOf(p){ const i = p.lastIndexOf("/"); return i < 0 ? "" : p.slice(0,i); }
function onChain(agentsPath, target){ const d = dirOf(agentsPath), t = dirOf(target); return d === "" || t === d || t.startsWith(d + "/"); }

function codeBlock(text, first, hiStart, hiEnd){

}
function ruleHtml(r, n, pk){

  <div class="quote">${esc(r.text)}</div>
  <details><summary>Surrounding section (lines ${r.section_first_line}-${r.section_last_line})</summary>${codeBlock(r.section_text, r.section_first_line, r.start_line, r.end_line)}</details>
  ${full!==undefined?`<details><summary>Full file ${esc(r.path)}</summary>${codeBlock(full.replace(/\n$/,""), 1, r.start_line, r.end_line)}</details>`:""}
  </section>`;
}
function radios(name, opts, val){
  return `<div class="opts">` + opts.map(([v,l]) => `<label><input type="radio" name="${name}" value="${esc(v)}" ${val===v?"checked":""}><span>${esc(l)}</span></label>`).join("") + `</div>`;
}
function render(){
  const it = P.items[cur], pk = it.packet, r = resp(it.item_id);
  const tree = pk.agents_paths.map(p => { const c = onChain(p, it.target_path);
    const tags = [p===pk.rule_1.path?"Instruction 1":"", p===pk.rule_2.path?"Instruction 2":""].filter(Boolean);
    return `<li class="${c?"chain":""}">${esc(p)}${c?'<span class="tag">on target\'s directory chain</span>':""}${tags.map(t=>`<span class="rtag">${t}</span>`).join("")}</li>`; }).join("");
  const scope = pk.scope_statements.length ? "<ul>" + pk.scope_statements.map(s => `<li><code>${esc(s.path)}:${s.line}</code> ${esc(s.text)}</li>`).join("") + "</ul>" : '<p class="muted">None found by the keyword scan.</p>';
  $("#main").innerHTML = `
  <p class="muted">Case ${cur+1} of ${P.items.length} &middot; <span class="mono">${esc(it.item_id)}</span>${it.practice?' &middot; <strong>Authored practice item</strong>':""}</p>
  <div class="card"><h2>Task</h2><div class="task">${esc(it.task)}</div>
    <dl class="kv" style="margin-top:8px"><dt>Target file</dt><dd class="mono">${esc(it.target_path)}</dd>
    <dt>Repository</dt><dd class="mono">${esc(it.repo)} @ ${esc(String(it.commit).slice(0,12))}</dd></dl></div>
  <div class="card"><h2>AGENTS.md files in the repository</h2><ul class="tree" style="padding-left:4px;margin:0">${tree}</ul>
    <details style="margin-left:0"><summary>Instruction-loading profile P1</summary><pre>${esc(P.profile_text)}</pre></details></div>
  <div class="rules">${ruleHtml(pk.rule_1,1,pk)}${ruleHtml(pk.rule_2,2,pk)}</div>
  <div class="card" style="margin-top:14px"><h2>Scope and precedence statements found in the loaded files</h2>${scope}</div>
  <form class="card" id="f" aria-label="Judgment"><h2>Your judgment</h2>
    <fieldset><legend>Label (required)</legend><div class="labels">${radios("label", LABELS.map(l=>[l,l]), r.label)}</div>
      <p class="muted" style="margin:6px 0 0">Keys 1-5 choose a label when you are not typing.</p></fieldset>
    <fieldset><legend>Before priority: is Instruction 1 active for this target and task?</legend>${radios("applies_1",[["active","Active"],["inactive","Inactive"],["unclear","Unclear"]], r.applies_1)}</fieldset>
    <fieldset><legend>Before priority: is Instruction 2 active for this target and task?</legend>${radios("applies_2",[["active","Active"],["inactive","Inactive"],["unclear","Unclear"]], r.applies_2)}</fieldset>
    <fieldset><legend>Do they regulate the same decision incompatibly?</legend>${radios("incompatible",[["yes","Yes"],["no","No"],["unclear","Unclear"],["na","Not applicable"]], r.incompatible)}</fieldset>
    <fieldset><legend>Winner if incompatible</legend>${radios("winner",[["1","Instruction 1"],["2","Instruction 2"],["none","No valid winner"],["na","Not applicable"]], r.winner)}</fieldset>
    <fieldset><legend>Evidence you relied on (path:line, one per line)</legend><textarea name="evidence" rows="2">${esc(r.evidence||"")}</textarea></fieldset>
    <fieldset><legend>Reason (required, one or two sentences)</legend><textarea name="reason" rows="3">${esc(r.reason||"")}</textarea></fieldset>
    <fieldset><legend>Confidence</legend>${radios("confidence",[["low","Low"],["medium","Medium"],["high","High"]], r.confidence)}</fieldset>
    <fieldset><legend>Context</legend><label class="row"><input type="checkbox" name="missing_context" ${r.missing_context?"checked":""}> Decisive context seems to be missing from this case</label>
      <input type="text" name="missing_note" placeholder="What is missing?" value="${esc(r.missing_note||"")}"></fieldset>
    <div class="row"><button type="button" id="prev">Previous</button><button type="submit" class="primary">Save and next</button>
      <span id="msg" class="muted" aria-live="polite"></span></div>
    <div id="fb"></div>
  </form>`;
  const f = $("#f");
  f.addEventListener("input", () => { collect(); updateNav(); });
  f.addEventListener("submit", e => { e.preventDefault(); collect(); r.saved_at = new Date().toISOString();
    if (!complete(r)) { $("#msg").textContent = "Choose a label and write a reason to complete this case."; save(); updateNav(); return; }
    save(); updateNav(); if (it.practice) { showFeedback(it); return; } go(cur+1); });
  $("#prev").onclick = () => go(cur-1);
  if (it.practice && complete(r) && r.saved_at) showFeedback(it);
  updateNav();
}
function showFeedback(it){
  $("#fb").innerHTML = `<div class="fb"><strong>Handbook answer for this authored practice item: ${esc(it.practice_answer)}.</strong> ${esc(it.practice_explanation)}
  <div class="row" style="margin-top:8px"><button type="button" id="nextAfterFb" class="primary">Next case</button></div></div>`;
  $("#nextAfterFb").onclick = () => go(cur+1);
}
function collect(){
  const it = P.items[cur], r = resp(it.item_id), f = $("#f"); const fd = new FormData(f);
  for (const k of ["label","applies_1","applies_2","incompatible","winner","confidence"]) { const v = fd.get(k); if (v!==null) r[k] = v; }
  r.evidence = fd.get("evidence"); r.reason = fd.get("reason"); r.missing_note = fd.get("missing_note");
  r.missing_context = !!f.elements.missing_context.checked; save();
}
function go(i){ tick(); save(); if (i<0 || i>=P.items.length) { if (i>=P.items.length) $("#msg") && ($("#msg").textContent = "Last case. Export JSON when every case is complete."); return; }
  cur = i; render(); $("#main").focus(); window.scrollTo(0,0); }
function updateNav(){
  const done = P.items.filter(it => complete(state.responses[it.item_id])).length;
  $("#count").textContent = `${done} / ${P.items.length} complete`; $("#bar").style.width = (100*done/P.items.length)+"%";
  $("#nav").innerHTML = P.items.map((it,i) => { const r = state.responses[it.item_id]; const cls = complete(r)?"done":(r&&r.label?"partial":"");
    return `<button data-i="${i}" aria-current="${i===cur}"><span>${i+1}. ${esc(it.item_id)}${it.practice?" (practice)":""}</span><span class="dot ${cls}" aria-label="${cls||"empty"}"></span></button>`; }).join("");
  $("#nav").querySelectorAll("button").forEach(b => b.onclick = () => go(+b.dataset.i));
}
function payload(){
  tick(); save();
  return {packet_id:P.packet_id, packet_sha256:P.packet_sha256, annotator_id:P.annotator_id, annotator_name:P.annotator_name,
    seed:P.seed, tool_version:P.tool_version, handbook_version:P.handbook_version, exported_at:new Date().toISOString(),
    items_total:P.items.length, items_complete:P.items.filter(it=>complete(state.responses[it.item_id])).length,
    responses:P.items.map(it => ({...(state.responses[it.item_id]||{item_id:it.item_id})}))};
}
function download(name, text, type){ const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text],{type}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
$("#exportJson").onclick = () => download(`${P.packet_id}_${P.annotator_id}_${new Date().toISOString().slice(0,16).replace(/[:T]/g,"-")}.json`, JSON.stringify(payload(), null, 1), "application/json");
$("#exportCsv").onclick = () => { const p = payload(); const cols = ["item_id","label","applies_1","applies_2","incompatible","winner","confidence","missing_context","missing_note","evidence","reason","active_ms","saved_at"];
  const q = v => `"${String(v ?? "").replace(/"/g,'""')}"`;
  download(`${P.packet_id}_${P.annotator_id}.csv`, [cols.join(",")].concat(p.responses.map(r => cols.map(c => q(r[c])).join(","))).join("\n"), "text/csv"); };
$("#importFile").onchange = async e => { const file = e.target.files[0]; if (!file) return;
  try { const d = JSON.parse(await file.text()); if (d.packet_id !== P.packet_id) { alert("This file belongs to a different packet."); return; }
    for (const r of d.responses) state.responses[r.item_id] = r; save(); render(); } catch (err) { alert("Could not read that file: " + err.message); } };
$("#hbBtn").onclick = () => { const hb = $("#hb"); hb.hidden = !hb.hidden; $("#hbBtn").setAttribute("aria-expanded", String(!hb.hidden)); };
document.addEventListener("keydown", e => { if (e.target.closest("textarea,input[type=text]") || e.ctrlKey || e.metaKey || e.altKey) return;
  const n = "12345".indexOf(e.key); if (n >= 0) { const el = document.querySelector(`input[name=label][value="${LABELS[n]}"]`); if (el) { el.checked = true; collect(); updateNav(); } } });
window.addEventListener("beforeunload", () => { tick(); save(); });
(function handbook(){ const md = document.getElementById("handbook").textContent; let html = "", inTable = false;
  for (const ln of md.split("\n")) { if (/^\|/.test(ln)) { if (/^\|[-| ]+\|$/.test(ln)) continue; const cells = ln.split("|").slice(1,-1).map(c=>esc(c.trim()).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>"));
      if (!inTable) { html += "<table>"; inTable = true; } html += "<tr>" + cells.map(c=>`<td>${c}</td>`).join("") + "</tr>"; continue; }
    if (inTable) { html += "</table>"; inTable = false; }
    const h = ln.match(/^(#{1,3}) (.*)/); if (h) { html += `<h${h[1].length+1}>${esc(h[2])}</h${h[1].length+1}>`; continue; }
    if (ln.trim()) html += `<p>${esc(ln).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>")}</p>`; }
  $("#hb").innerHTML = html + (inTable?"</table>":""); })();
$("#who").textContent = `${P.title} · annotator ${P.annotator_id} (${P.annotator_name}) · ${P.items.length} cases`;
if (!storageOk) { const w = document.createElement("div"); w.className = "warn"; w.setAttribute("role", "alert");
  w.textContent = "This browser is not saving progress automatically. Use Export JSON often, and Import JSON to continue later. Opening the file directly in Chrome, Edge or Firefox normally enables autosave.";
  document.querySelector("header").after(w); }
render();
</script>
</body>
</html>
