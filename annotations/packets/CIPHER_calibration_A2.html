t the release branch for release-specific packaging,\n  CI, and branch guidance. Resolve the next release and milestone from the\n  fetched target's `docs/onboarding/release-management.md`.\n- Use `.github/PULL_REQUEST_TEMPLATE.md` and set the resolved release milestone\n  on PRs.\n- Do not prefix commit messages or PR titles with agent tags like `[codex]`;\n  use plain descriptive titles.\n- Keep private, local, and machine-specific paths out of published files,\n  commit messages, and PR text; validate with `scripts/check_local_paths.py`.\n- Before every approved push to a published PR branch, first merge the latest\n  base branch into it — merge, never rebase a published PR branch.\n- GitHub mutations, pushes, PR changes, CI reruns, review-thread mutations, and\n  branch deletion require explicit maintainer/user approval.\n- Open PRs as drafts, then mark them ready and merge them only as\n  `docs/onboarding/ai-tools.md` § \"PR Lifecycle\" describes.\n- Never reply to AI-generated review comments (bot users such as\n  `chatgpt-codex-connector[bot]`, `github-code-quality[bot]`,\n  `github-actions[bot]`, `copilot[bot]`); make approved local fixes silently.\n\n## AI Capability Sources\n\nEditable workflows and domain skills live in `.claude/commands/` and\n`.claude/skills/`. Generated Codex and Muse adapters live in\n`.agents/skills/`; do not hand-edit them. Treat\nonly paths listed by `.agents/skills/.dart-generated.json`, plus the\nmanifest itself, as DART-generated output: preserve unrelated skills in the\nshared `.agents/skills/` directory, and let sync remove only\nmanifest-owned paths.\n\n```bash\npixi run sync-ai-commands\npixi run check-ai-commands\npixi run python scripts/setup_ai.py\npixi run python scripts/check_ai_infrastructure.py --doctor\n```\n\nUnder Muse's default shell sandbox, `.git/` and `.agents/` stay\nread-only, so run Git mutations (switch, commit, merge) and\n`sync-ai-commands` from an unsandboxed shell there (see\n`docs/onboarding/ai-tools.md`).\n\nUse `$dart-ultrawork` in Codex or `/dart-ultrawork` in Claude and Muse\nCode for large, multi-session, or explicitly autonomous work. Its\nproject home is `docs/dev_tasks/<task>/`.\n\n## Before Every Commit\n\n- Run `pixi run lint`, even for docs-only changes.\n- Run `pixi run build` and focused tests when C++ or Python behavior changes;\n  GUI changes also run `pixi run test-gui`.\n- Use `dart-changelog` to decide whether `CHANGELOG.md` needs an entry.\n- Promote durable facts and remove a completing `docs/dev_tasks/<task>/` folder.\n- Run `pixi run install-hooks` once per clone. Its fast staged safety check is\n  not a substitute for the full lint requirement. When it blocks a commit, fix\n  the reported failure; `DART_SKIP_HOOKS=1` is a maintainer emergency bypass\n  to use only when a maintainer explicitly asks.\n", "docs/design/AGENTS.md": "# docs/design/\n\nAgent rules for durable DART design documents.\n\n## Purpose\n\n`docs/design/` owns technical rationale that should survive after a plan or\ndev task completes. Design docs explain architecture, API shape,\ncompatibility constraints, tradeoffs, decisions, and non-goals.\n\nThey are not roadmap dashboards or implementation handoff logs.\n\n## Rules\n\n- Start with `docs/README.md`, `docs/information-architecture.md`, then this\n  file.\n- Keep design docs durable and current-state oriented. Use Git history for old\n  alternatives that are no longer relevant.\n- Do not put priority, horizon, next step, gate, or active implementation\n  handoff state here. Use `docs/plans/dashboard.md` and\n  `docs/dev_tasks/<task>/` for that state.\n- Preserve the compatibility envelope in `AGENTS.md`: public headers,\n  installed package components, and the Gazebo-facing C++ API and behavior.\n  ABI-sensitive class layouts become release-branch constraints once a\n  release line is first packaged.\n- Link every direct `docs/design/*.md` file from `docs/design/README.md`.\n\n## Verification\n\nUse `docs/ai/verification.md` to select gates. For design-only Markdown edits,\nrun `pixi run lint`.\n"}}}, {"item_id": "c6a1782", "practice": false, "task": "Make a small fix in `packages/auditlog/src/app.tsx` and complete the checks this change requires before committing.", "target_path": "packages/auditlog/src/app.tsx", "repo": "SEMOSS/semoss-ui", "commit": "535fc9a41111c739473142cebf1872b8980619ed", "packet": {"agents_paths": ["AGENTS.md", "libs/connectors/AGENTS.md", "libs/i18n/AGENTS.md", "libs/panels/AGENTS.md", "libs/renderer/AGENTS.md", "libs/sdk/AGENTS.md", "libs/shared/AGENTS.md", "libs/ui/AGENTS.md", "libs/utility/AGENTS.md", "libs/workbench/AGENTS.md", "packages/auditlog/AGENTS.md", "packages/automation/AGENTS.md", "packages/browser-automation/AGENTS.md", "packages/cli/AGENTS.md", "packages/client/AGENTS.md", "packages/playground/AGENTS.md", "packages/terminal/AGENTS.md"], "rule_1": {"path": "packages/auditlog/AGENTS.md", "start_line": 35, "end_line": 37, "heading": "AGENTS.md - @semoss/auditlog-package > Build System > Linting", "text": "Follow the [React validation guidance](../../skills/react-standard.skill.md#validation).\nThis package additionally ships `eslint.config.js` with React hooks/refresh plugins; run\nits local check alongside the applicable root check:", "section_first_line": 33, "section_last_line": 42, "section_text": "### Linting\n\nFollow the [React validation guidance](../../skills/react-standard.skill.md#validation).\nThis package additionally ships `eslint.config.js` with React hooks/refresh plugins; run\nits local check alongside the applicable root check:\n\n```bash\npnpm check                          # Biome (repo-wide)\npnpm --filter @semoss/auditlog-package lint   # ESLint (react hooks/refresh)\n```"}, "rule_2": {"path": "AGENTS.md", "start_line": 40, "end_line": 40, "heading": "AGENTS.md - SEMOSS Monorepo > Required Skill Routing (All Agents)", "text": "Lint and formatting configuration lives in [biome.json](./biome.json).", "section_first_line": 5, "section_last_line": 40, "section_text": "## Required Skill Routing (All Agents)\n\n**Before any task involving React files, every agent must read the full\n[React standard](./skills/react-standard.skill.md).** This is mandatory for all\nproviders and delegated agents when creating, editing, refactoring, debugging,\ninvestigating, planning changes to, or reviewing React code anywhere in the repo.\nIt covers `.tsx` and `.jsx` files, React components/hooks/context/providers in\n`.ts` or `.js` files, and React tests, stories, and examples. Task size and location\noutside `src/` do not waive this requirement.\n\n- Read the file itself; a link, skill listing, metadata, or summary is not a\n  substitute for its full contents. Do not rely on automatic skill discovery.\n- Apply its rules according to the work: React rules govern React code;\n  applicable language, architecture, compatibility, and validation rules govern\n  other work. Preserve documented exceptions and protected-file restrictions.\n- Unrelated documentation, configuration, scripts, and CI tasks do not require\n  this skill solely because they are in the repository.\n- After reading it, briefly identify `skills/react-standard.skill.md` in a\n  progress update; delegated agents must also identify it in their handoff.\n- Include this mandatory reading requirement in every delegated React task. Each\n  agent is responsible for loading the standard in its own context.\n- If context is compacted or lost, reload the standard before continuing unless\n  its full contents remain available. If the file cannot be read, report that\n  blocker before proceeding with React work.\n\nRead the owning package's `AGENTS.md` and use the [skill index](./skills/README.md)\nto load additional skills before the relevant work. Package guides and specialized\nskills supplement the standard; they do not waive reading it for React work.\n\n- [Accessibility](./skills/accessibility.skill.md): interactive UI and accessible behavior.\n- [Mobile development](./skills/mobile-development.skill.md): responsive and touch interfaces.\n- [React form builder](./skills/react-form-builder.skill.md): form fields, validation, and submission.\n- [SDK chat](./skills/sdk-chat.skill.md): rooms, messages, agent runs, approvals, and polling lifecycle.\n- [Design rulebook](./DESIGN.md): UI composition and styling.\n\nLint and formatting configuration lives in [biome.json](./biome.json)."}, "scope_statements": [{"path": "AGENTS.md", "line": 1, "text": "# AGENTS.md - SEMOSS Monorepo"}, {"path": "AGENTS.md", "line": 30, "text": "Read the owning package's `AGENTS.md` and use the [skill index](./skills/README.md)"}, {"path": "AGENTS.md", "line": 81, "text": "[libs/panels/AGENTS.md](./libs/panels/AGENTS.md#what-a-host-has-to-wire-up)."}, {"path": "AGENTS.md", "line": 85, "text": "[libs/connectors/AGENTS.md](./libs/connectors/AGENTS.md#what-a-host-has-to-wire-up)."}, {"path": "AGENTS.md", "line": 140, "text": "See [DESIGN.md](./DESIGN.md) and the [UI component catalog](./libs/ui/AGENTS.md)."}, {"path": "AGENTS.md", "line": 159, "text": "for imports within a package. See [the utility guide](./libs/utility/AGENTS.md)."}, {"path": "AGENTS.md", "line": 160, "text": "- Search individual files, nested functions, callbacks, and repeated expressions as"}, {"path": "AGENTS.md", "line": 174, "text": "- **`*.local`** files - Local environment overrides (gitignored)"}, {"path": "AGENTS.md", "line": 185, "text": "## Nested AGENTS.md Files"}, {"path": "AGENTS.md", "line": 188, "text": "- [libs/utility/AGENTS.md](./libs/utility/AGENTS.md) - Generic utility ownership and public categories"}, {"path": "AGENTS.md", "line": 189, "text": "- [libs/sdk/AGENTS.md](./libs/sdk/AGENTS.md) - Core SDK specifics"}, {"path": "AGENTS.md", "line": 190, "text": "- [libs/ui/AGENTS.md](./libs/ui/AGENTS.md) - Component library specifics"}, {"path": "AGENTS.md", "line": 191, "text": "- [libs/shared/AGENTS.md](./libs/shared/AGENTS.md) - Shared utilities/components specifics"}, {"path": "AGENTS.md", "line": 192, "text": "- [libs/connectors/AGENTS.md](./libs/connectors/AGENTS.md) - Microsoft 365 and Google Workspace viewers"}, {"path": "AGENTS.md", "line": 193, "text": "- [libs/renderer/AGENTS.md](./libs/renderer/AGENTS.md) - Visualization components specifics"}], "full_files": {"AGENTS.md": "# AGENTS.md - SEMOSS Monorepo\n\nThis document provides context for AI coding assistants working with the SEMOSS monorepo.\n\n## Required Skill Routing (All Agents)\n\n**Before any task involving React files, every agent must read the full\n[React standard](./skills/react-standard.skill.md).** This is mandatory for all\nproviders and delegated agents when creating, editing, refactoring, debugging,\ninvestigating, planning changes to, or reviewing React code anywhere in the repo.\nIt covers `.tsx` and `.jsx` files, React components/hooks/context/providers in\n`.ts` or `.js` files, and React tests, stories, and examples. Task size and location\noutside `src/` do not waive this requirement.\n\n- Read the file itself; a link, skill listing, metadata, or summary is not a\n  substitute for its full contents. Do not rely on automatic skill discovery.\n- Apply its rules according to the work: React rules govern React code;\n  applicable language, architecture, compatibility, and validation rules govern\n  other work. Preserve documented exceptions and protected-file restrictions.\n- Unrelated documentation, configuration, scripts, and CI tasks do not require\n  this skill solely because they are in the repository.\n- After reading it, briefly identify `skills/react-standard.skill.md` in a\n  progress update; delegated agents must also identify it in their handoff.\n- Include this mandatory reading requirement in every delegated React task. Each\n  agent is responsible for loading the standard in its own context.\n- If context is compacted or lost, reload the standard before continuing unless\n  its full contents remain available. If the file cannot be read, report that\n  blocker before proceeding with React work.\n\nRead the owning package's `AGENTS.md` and use the [skill index](./skills/README.md)\nto load additional skills before the relevant work. Package guides and specialized\nskills supplement the standard; they do not waive reading it for React work.\n\n- [Accessibility](./skills/accessibility.skill.md): interactive UI and accessible behavior.\n- [Mobile development](./skills/mobile-development.skill.md): responsive and touch interfaces.\n- [React form builder](./skills/react-form-builder.skill.md): form fields, validation, and submission.\n- [SDK chat](./skills/sdk-chat.skill.md): rooms, messages, agent runs, approvals, and polling lifecycle.\n- [Design rulebook](./DESIGN.md): UI composition and styling.\n\nLint and formatting configuration lives in [biome.json](./biome.json).\n\n## Overview\n\nSEMOSS is a React-based analytics platform built as a pnpm monorepo with Turborepo orchestration.\n\n**Workspace Dependencies:**\n\nThese summaries include declared internal dependencies and peers. Package manifests\nand the owning guides define the exact public entry points and architectural boundaries.\n\nLibraries (`libs/*`, publishable):\n- `@semoss/utility` → Generic text, date, object, JSON, file, encoding, browser, and other functional helpers\n- `@semoss/sdk` → Core SDK (no internal dependencies)\n- `@semoss/ui` → Component library (no internal dependencies)\n- `@semoss/i18n` → Internationalization library (no internal dependencies)\n- `@semoss/shared` → Shared utilities (depends on i18n, sdk, ui, utility)\n- `@semoss/connectors` → Microsoft 365 and Google Workspace viewers (depends on i18n, sdk,\n  shared, ui, utility)\n- `@semoss/renderer` → Visualization components (depends on sdk, shared, ui)\n- `@semoss/workbench` → Multi-panel dock shell (depends on ui only — deliberately\n  domain-agnostic, so it can never import sdk, shared or i18n)\n- `@semoss/panels` → File panels for the dock (depends on i18n, sdk, shared, ui, utility, workbench)\n\nThe dock and the panels are two layers, in one direction:\n`@semoss/ui ← @semoss/workbench ← @semoss/panels → @semoss/shared → @semoss/sdk`.\n\nApplications (`packages/*`, not published):\n- `@semoss/client` → Main web application (depends on automation, i18n, panels, renderer, sdk, shared, terminal, ui, utility, workbench)\n- `@semoss/playground` → Chat (depends on connectors, i18n, panels, sdk, shared, ui, utility, workbench)\n- `@semoss/terminal` → Embedded terminal (depends on i18n, panels, sdk, shared, ui, workbench)\n- `@semoss/auditlog-package` → Audit log dashboard (depends on i18n, sdk, shared, ui)\n- `@semoss/automation` → Automation workspace app (depends on i18n, sdk, shared, ui, utility;\n  no client-store dependency)\n- `@semoss/cli` → CLI tooling (depends on sdk)\n- `@semoss/browser-automation` → Browser automation harness (depends on sdk, ui, utility)\n- `workshop-automation-extension` → Chrome extension (depends on sdk, ui, utility)\n\n**Every host that mounts a dock or a file panel** imports\n`@semoss/workbench/globals.css` and `@semoss/panels/globals.css`, and takes\n`aiSdkStubAlias` + `scopePptxViewerCssPlugin` from `@semoss/panels/vite`. See\n[libs/panels/AGENTS.md](./libs/panels/AGENTS.md#what-a-host-has-to-wire-up).\n\n**Every host that mounts a connector viewer** imports `@semoss/connectors/globals.css` and loads\nthe `connectors` i18n namespace. See\n[libs/connectors/AGENTS.md](./libs/connectors/AGENTS.md#what-a-host-has-to-wire-up).\n\n## Workspace Structure\n\n```\nsemoss/\n├── libs/           # Shared libraries (publishable)\n│   ├── utility/    # Generic cross-package utility functions\n│   ├── sdk/        # @semoss/sdk - Core SDK\n│   ├── ui/         # @semoss/ui - Component library\n│   ├── i18n/       # @semoss/i18n - Internationalization library\n│   ├── shared/     # @semoss/shared - Shared utilities\n│   ├── connectors/ # @semoss/connectors - Microsoft 365 and Google Workspace viewers\n│   ├── renderer/   # @semoss/renderer - Visualization components\n│   ├── workbench/  # @semoss/workbench - Multi-panel dock shell\n│   └── panels/     # @semoss/panels - File panels for the dock\n├── packages/       # Applications (not published)\n│   ├── client/                     # @semoss/client - Main web application\n│   ├── playground/                 # @semoss/playground - Chat\n│   ├── terminal/                   # @semoss/terminal - Embedded terminal app\n│   ├── auditlog/                   # @semoss/auditlog-package - Audit log dashboard\n│   ├── automation/                 # @semoss/automation - Automation workspace app\n│   ├── browser-automation/         # @semoss/browser-automation - Browser automation harness\n│   ├── chrome-extension/           # Chrome extension for browser automation\n│   ├── vscode-extension/           # semoss-vscode - VSCode extension\n│   └── cli/                        # @semoss/cli - CLI tooling\n├── skills/         # Provider-neutral *.skill.md guidance\n├── pnpm-workspace.yaml\n├── turbo.json\n└── biome.json\n```\n\n## Requirements\n\n- **Node.js**: >=24.4.0 <25 (see `.nvmrc`)\n- **pnpm**: ~10.13.0 (see `engines`; `packageManager` pins `pnpm@10.13.1`)\n\n## Build Commands\n\n| Command | Description |\n|---------|-------------|\n| `pnpm install` | Install all dependencies |\n| `pnpm dev` | Run all packages in dev mode |\n| `pnpm dev:client` | Run client with dependencies |\n| `pnpm dev:playground` | Run playground with dependencies |\n| `pnpm dev:terminal` | Run terminal with dependencies |\n| `pnpm build` | Production build all packages |\n| `pnpm build:dev` | Development build all packages |\n| `pnpm test` | Run all tests |\n| `pnpm test:watch` | Run tests in watch mode |\n| `pnpm check` | Run Biome linting/formatting check |\n| `pnpm fix` | Auto-fix Biome issues |\n\n## Design System & Styling\n\nSee [DESIGN.md](./DESIGN.md) and the [UI component catalog](./libs/ui/AGENTS.md).\n\n## Incremental Migration\n\nSee the React skill's [scope](./skills/react-standard.skill.md#authorities-and-scope) and\n[full-file review workflow](./skills/react-standard.skill.md#full-file-review-and-handoff).\n\n## Package Structure Conventions\n\nSee the React skill's [architecture](./skills/react-standard.skill.md#architecture-and-exports)\nand [naming conventions](./skills/react-standard.skill.md#types-and-naming), plus the owning\npackage guide below.\n\n## Agent Guardrails\n\n### Utility Ownership\n\n- Put reusable generic functions in `libs/utility`, grouped into flat files by function.\n  Import from the supported `@semoss/utility/<category>` subpath; use defining files\n  for imports within a package. See [the utility guide](./libs/utility/AGENTS.md).\n- Search individual files, nested functions, callbacks, and repeated expressions as\n  well as utility directories before adding helpers. Equivalent implementations can\n  use different names or syntax.\n- Keep feature policy, UI composition, SDK transport, and orchestration in their\n  owning packages. Preserve dependency boundaries: this does not authorize adding\n  utility dependencies to SDK, UI, i18n, workbench, or CLI.\n- Preserve whitespace, timezone, rounding, null/fallback, filename, and error behavior.\n  Use compatibility re-exports or small adapters for existing public contracts.\n- Prefer native operations over unnecessary wrappers. Do not add option-heavy\n  abstractions just to combine helpers with materially different contracts.\n\n### Do Not Modify\n- **`pnpm-lock.yaml`** - Managed by pnpm, never edit manually\n- **`pom.xml`** - Maven build configuration for deployment\n- **`*.local`** files - Local environment overrides (gitignored)\n- **`settings.xml`** - Maven settings for deployment\n\n### Be Cautious With\n- **`turbo.json`** - Affects build caching and task dependencies\n- **`biome.json`** - Changes affect all packages\n- **Root `package.json`** - Engine constraints affect all developers\n\nFor validation and handoff, follow the React skill's\n[review checklist](./skills/react-standard.skill.md#full-file-review-and-handoff).\n\n## Nested AGENTS.md Files\n\n**Libraries** (`libs/*`):\n- [libs/utility/AGENTS.md](./libs/utility/AGENTS.md) - Generic utility ownership and public categories\n- [libs/sdk/AGENTS.md](./libs/sdk/AGENTS.md) - Core SDK specifics\n- [libs/ui/AGENTS.md](./libs/ui/AGENTS.md) - Component library specifics\n- [libs/shared/AGENTS.md](./libs/shared/AGENTS.md) - Shared utilities/components specifics\n- [libs/connectors/AGENTS.md](./libs/connectors/AGENTS.md) - Microsoft 365 and Google Workspace viewers\n- [libs/renderer/AGENTS.md](./libs/renderer/AGENTS.md) - Visualization components specifics\n- [libs/i18n/AGENTS.md](./libs/i18n/AGENTS.md) - Internationalization library specifics\n- [libs/workbench/AGENTS.md](./libs/workbench/AGENTS.md) - Workbench dock shell specifics\n- [libs/panels/AGENTS.md](./libs/panels/AGENTS.md) - File panels for the dock\n\n**Applications** (`packages/*`):\n- [packages/client/AGENTS.md](./packages/client/AGENTS.md) - Main web application specifics\n- [packages/playground/AGENTS.md](./packages/playground/AGENTS.md) - Playground (chat) app specifics\n- [packages/terminal/AGENTS.md](./packages/terminal/AGENTS.md) - Embedded terminal app specifics\n- [packages/auditlog/AGENTS.md](./packages/auditlog/AGENTS.md) - Audit log dashboard app specifics\n- [packages/automation/AGENTS.md](./packages/automation/AGENTS.md) - Automation workspace app specifics\n- [packages/browser-automation/AGENTS.md](./packages/browser-automation/AGENTS.md) - Browser automation harness specifics\n- [packages/cli/AGENTS.md](./packages/cli/AGENTS.md) - CLI tooling specifics\n", "packages/auditlog/AGENTS.md": "# AGENTS.md - @semoss/auditlog-package\n\nThis document provides context for AI coding assistants working with the SEMOSS audit log\ndashboard application.\n\n> **Inherits from:** [root AGENTS.md](../../AGENTS.md). Load the applicable\n> [root skills](../../skills/README.md), including the [React standard](../../skills/react-standard.skill.md).\n\n## Overview\n\n`@semoss/auditlog-package` is a standalone dashboard application for viewing SEMOSS audit\nlogs. It is a **private** package built with Vite, MobX, and `react-router`.\n\n## Build System\n\n- **Bundler**: Vite 8\n- **State**: MobX (`mobx` + `mobx-react-lite`)\n- **Routing**: `react-router` 8\n- **Styling**: Tailwind CSS v4\n\n### Commands\n\n| Command | Description |\n|---------|-------------|\n| `pnpm dev` | Start dev server |\n| `pnpm build` | Production build |\n| `pnpm test` | Vitest (`--passWithNoTests`; success may mean no tests ran) |\n| `pnpm lint` | **ESLint** (see Linting below) |\n| `pnpm preview` | Preview the production build |\n\nRun these from `packages/auditlog`, or use `pnpm --filter @semoss/auditlog-package <command>`.\n\n### Linting\n\nFollow the [React validation guidance](../../skills/react-standard.skill.md#validation).\nThis package additionally ships `eslint.config.js` with React hooks/refresh plugins; run\nits local check alongside the applicable root check:\n\n```bash\npnpm check                          # Biome (repo-wide)\npnpm --filter @semoss/auditlog-package lint   # ESLint (react hooks/refresh)\n```\n\n## Structure\n\nThe existing layout is below. New application features follow the\n[React architecture policy](../../skills/react-standard.skill.md#architecture-and-exports);\ndo not relocate existing features without explicit migration scope.\n\n| Folder / file | Purpose |\n|---------------|---------|\n| `assets/` | Images and static files |\n| `components/` | Components (one per file) |\n| `contexts/` | React contexts (`<name>.context.tsx`) |\n| `hooks/` | React hooks (`use-<name>.ts`) |\n| `pages/` | Routing tree — `router.tsx`, layouts, pages |\n| `stores/` | MobX stores (`<name>.store.ts`) |\n| `types.d.ts` | Ambient TypeScript types |\n| `app.tsx`, `main.tsx`, `index.css` | App entry files |\n\n> Some page files retain legacy names. Apply the React skill's\n> [naming policy](../../skills/react-standard.skill.md#types-and-naming) without unrelated renames.\n\n## Design-System Notes\n\nFollow the root [Design System & Styling](../../AGENTS.md#design-system--styling) rules and\n[DESIGN.md](../../DESIGN.md). Preserve the audit dashboard's dense list/filter/table\ncomposition; responsive and accessible behavior follow the [root skills](../../skills/README.md).\n\n## Agent Guardrails\n\n### Be Cautious With\n\n- **`vite.config.ts`** — dev server and build configuration.\n- **`eslint.config.js`** — local lint rules for this package.\n\n### Testing Changes\n\n```bash\npnpm --filter @semoss/auditlog-package lint\npnpm --filter @semoss/auditlog-package build\n```\n"}}}, {"item_id": "cfecf7d", "practice": false, "task": "Revise one section of `dart/dynamics/ContactInverseDynamics.hpp` and complete the checks this change requires.", "target_path": "dart/dynamics/ContactInverseDynamics.hpp", "repo": "dartsim/dart", "commit": "738349bd45477c5eeadd128f85ec66dfc34f195d", "packet": {"agents_paths": ["AGENTS.md", "docs/AGENTS.md", "docs/background/AGENTS.md", "docs/design/AGENTS.md", "docs/plans/AGENTS.md"], "rule_1": {"path": "docs/background/AGENTS.md", "start_line": 25, "end_line": 26, "heading": "docs/background/ > Verification", "text": "Use `docs/ai/verification.md` to select gates. For background-only Markdown\nedits, run `pixi run lint`.", "section_first_line": 23, "section_last_line": 26, "section_text": "## Verification\n\nUse `docs/ai/verification.md` to select gates. For background-only Markdown\nedits, run `pixi run lint`."}, "rule_2": {"path": "AGENTS.md", "start_line": 124, "end_line": 125, "heading": "Agent Guidelines for DART > Before Every Commit", "text": "- Run `pixi run build` and focused tests when C++ or Python behavior changes;\n  GUI changes also run `pixi run test-gui`.", "section_first_line": 121, "section_last_line": 131, "section_text": "## Before Every Commit\n\n- Run `pixi run lint`, even for docs-only changes.\n- Run `pixi run build` and focused tests when C++ or Python behavior changes;\n  GUI changes also run `pixi run test-gui`.\n- Use `dart-changelog` to decide whether `CHANGELOG.md` needs an entry.\n- Promote durable facts and remove a completing `docs/dev_tasks/<task>/` folder.\n- Run `pixi run install-hooks` once per clone. Its fast staged safety check is\n  not a substitute for the full lint requirement. When it blocks a commit, fix\n  the reported failure; `DART_SKIP_HOOKS=1` is a maintainer emergency bypass\n  to use only when a maintainer explicitly asks."}, "scope_statements": [{"path": "AGENTS.md", "line": 45, "text": "| Documentation placement              | `docs/README.md`, `docs/information-architecture.md`, `docs/AGENTS.md`                                |"}, {"path": "AGENTS.md", "line": 55, "text": "Subdirectories may provide a closer `AGENTS.md`; instructions accumulate from"}], "full_files": {"AGENTS.md": "# Agent Guidelines for DART\n\nThis file is the single shared rules file and repository pointer board for\nClaude Code, Codex, and Muse; keep shared guidance here (see\n`docs/onboarding/ai-tools.md`). Start every task with\n`docs/ai/principles.md`, then load only the owner docs needed for the work.\nDelegate by default under `docs/ai/orchestration.md`; honor a per-task\n`delegation=off` opt-out.\n\n@docs/ai/principles.md\n\n## Project Profile\n\n- **WHAT**: C++17 robotics physics engine with dartpy bindings (nanobind)\n- **WHY**: A Python-first DART 7 that stays compatible with Gazebo/gz-physics\n- **HOW**: Use repository `pixi run ...` tasks; run `pixi run lint` before commits\n\n## Quick Commands\n\n```bash\npixi run config       # Configure the default CMake/Ninja build\npixi run build        # Build C++ libraries and utilities\npixi run test         # Build and run C++ tests\npixi run build-py-dev # Build dartpy\npixi run test-py      # Run dartpy tests\npixi run test-all     # Build defaults and run C++/Python tests\npixi run test-gui     # Run Filament GUI tests that need a graphics device\npixi run lint         # Format code, docs, TOML, and spelling (auto-fixes)\npixi run check-lint   # Run the non-mutating lint aggregate\n```\n\nFor downstream-sensitive changes, also run `pixi run -e gazebo test-gz`.\nSee `docs/onboarding/ci-cd.md` when a gate fails.\n\n## Task-specific Context\n\n| Task                                 | Load these owners                                                                                     |\n| ------------------------------------ | ----------------------------------------------------------------------------------------------------- |\n| Any task                             | `docs/ai/principles.md`                                                                               |\n| Architecture or component boundaries | `docs/onboarding/architecture.md`                                                                     |\n| Building or dependencies             | `docs/onboarding/building.md`, `docs/onboarding/build-system.md`                                      |\n| Testing or simulation evidence       | `docs/onboarding/testing.md`, `docs/ai/verification.md`; use `dart-verify-sim`                        |\n| Performance investigations or claims | `docs/onboarding/profiling.md` § \"Performance Methodology\"; use `dart-perf` |\n| Contribution, branches, or style     | `docs/onboarding/contributing.md`, `docs/onboarding/code-style.md`, `CONTRIBUTING.md`                 |\n| Documentation placement              | `docs/README.md`, `docs/information-architecture.md`, `docs/AGENTS.md`                                |\n| AI workflows or tooling              | `docs/ai/README.md`, `docs/ai/workflows.md`, `docs/ai/terminology.md`, `docs/onboarding/ai-tools.md`  |\n| Planning or autonomous work          | `docs/ai/north-star.md`, `docs/plans/dashboard.md`, `docs/ai/orchestration.md`, `docs/ai/sessions.md` |\n| CI failures                          | `docs/onboarding/ci-cd.md`                                                                            |\n| Python bindings                      | `docs/onboarding/python-bindings.md`                                                                  |\n| Model loading and parsers            | `docs/onboarding/io-parsing.md`                                                                       |\n| Release maintenance                  | `docs/onboarding/release-management.md`                                                               |\n| Changelog decisions                  | `docs/onboarding/changelog.md`, `docs/onboarding/release-management.md`                               |\n| Multi-session dev tasks              | `docs/dev_tasks/README.md`                                                                            |\n\nSubdirectories may provide a closer `AGENTS.md`; instructions accumulate from\nthe repository root to the working directory.\n\n## Compatibility Rules\n\n- Branch from the resolved target into a non-tracking topic branch\n  (`origin/main` by default); never commit directly to `main` or `release-*`.\n- `main` is the Python-first DART 7 line ([PLAN-624](docs/plans/dashboard.md));\n  `release-6.20` is the DART 6 maintenance line and keeps its own checkout's rules.\n- On `main`, preserve C++17, the nanobind binder, `dart::utils` parsers, Filament,\n  installed headers, package components (including legacy forwarding components),\n  and source and behavior compatibility of the C++ API used by Gazebo/gz-physics\n  and gz-sim. PLAN-624 approves the dartpy clean break, the OSG-to-Filament\n  renderer replacement merged in #3696, labeled default-behavior changes\n  behind its gates, and, until 7.0.0 is packaged, ABI-layout changes in classes\n  Gazebo neither subclasses nor reads, gated by the API inventory check and the\n  unpatched Gazebo lanes; any other public-API, ABI-layout, or default-behavior\n  change needs maintainer approval.\n- dartpy uses nanobind as its only binder, under `python/dartpy/`; follow\n  `docs/onboarding/python-bindings.md`.\n- New fixes land on `main`; backports to a `release-*` branch use\n  `dart-backport-pr`. Target the release branch for release-specific packaging,\n  CI, and branch guidance. Resolve the next release and milestone from the\n  fetched target's `docs/onboarding/release-management.md`.\n- Use `.github/PULL_REQUEST_TEMPLATE.md` and set the resolved release milestone\n  on PRs.\n- Do not prefix commit messages or PR titles with agent tags like `[codex]`;\n  use plain descriptive titles.\n- Keep private, local, and machine-specific paths out of published files,\n  commit messages, and PR text; validate with `scripts/check_local_paths.py`.\n- Before every approved push to a published PR branch, first merge the latest\n  base branch into it — merge, never rebase a published PR branch.\n- GitHub mutations, pushes, PR changes, CI reruns, review-thread mutations, and\n  branch deletion require explicit maintainer/user approval.\n- Open PRs as drafts, then mark them ready and merge them only as\n  `docs/onboarding/ai-tools.md` § \"PR Lifecycle\" describes.\n- Never reply to AI-generated review comments (bot users such as\n  `chatgpt-codex-connector[bot]`, `github-code-quality[bot]`,\n  `github-actions[bot]`, `copilot[bot]`); make approved local fixes silently.\n\n## AI Capability Sources\n\nEditable workflows and domain skills live in `.claude/commands/` and\n`.claude/skills/`. Generated Codex and Muse adapters live in\n`.agents/skills/`; do not hand-edit them. Treat\nonly paths listed by `.agents/skills/.dart-generated.json`, plus the\nmanifest itself, as DART-generated output: preserve unrelated skills in the\nshared `.agents/skills/` directory, and let sync remove only\nmanifest-owned paths.\n\n```bash\npixi run sync-ai-commands\npixi run check-ai-commands\npixi run python scripts/setup_ai.py\npixi run python scripts/check_ai_infrastructure.py --doctor\n```\n\nUnder Muse's default shell sandbox, `.git/` and `.agents/` stay\nread-only, so run Git mutations (switch, commit, merge) and\n`sync-ai-commands` from an unsandboxed shell there (see\n`docs/onboarding/ai-tools.md`).\n\nUse `$dart-ultrawork` in Codex or `/dart-ultrawork` in Claude and Muse\nCode for large, multi-session, or explicitly autonomous work. Its\nproject home is `docs/dev_tasks/<task>/`.\n\n## Before Every Commit\n\n- Run `pixi run lint`, even for docs-only changes.\n- Run `pixi run build` and focused tests when C++ or Python behavior changes;\n  GUI changes also run `pixi run test-gui`.\n- Use `dart-changelog` to decide whether `CHANGELOG.md` needs an entry.\n- Promote durable facts and remove a completing `docs/dev_tasks/<task>/` folder.\n- Run `pixi run install-hooks` once per clone. Its fast staged safety check is\n  not a substitute for the full lint requirement. When it blocks a commit, fix\n  the reported failure; `DART_SKIP_HOOKS=1` is a maintainer emergency bypass\n  to use only when a maintainer explicitly asks.\n", "docs/background/AGENTS.md": "# docs/background/\n\nAgent rules for DART theory and research background.\n\n## Purpose\n\n`docs/background/` owns durable theory, math, paper, and reference notes that\nhelp agents understand DART implementation work. It is not the place for\nDART-specific design decisions, roadmap priority, or active handoff state.\n\n## Rules\n\n- Start with `docs/README.md`, `docs/information-architecture.md`, and\n  `docs/background/README.md`.\n- Preserve attribution for material derived from papers, textbooks, PDFs, or\n  external projects.\n- Keep release-branch claims compatibility-aware. Changes need direct\n  compatibility evidence against their target branch.\n- Put DART architecture and API tradeoffs in `docs/design/`.\n- Put priority, next steps, and acceptance gates in `docs/plans/`.\n- Put active implementation handoff state in `docs/dev_tasks/<task>/`.\n\n## Verification\n\nUse `docs/ai/verification.md` to select gates. For background-only Markdown\nedits, run `pixi run lint`.\n"}}}, {"item_id": "c39e2cc", "practice": false, "task": "Make a small behaviour change in `libs/ui/vite.config.ts`.", "target_path": "libs/ui/vite.config.ts", "repo": "SEMOSS/semoss-ui", "commit": "535fc9a41111c739473142cebf1872b8980619ed", "packet": {"agents_paths": ["AGENTS.md", "libs/connectors/AGENTS.md", "libs/i18n/AGENTS.md", "libs/panels/AGENTS.md", "libs/renderer/AGENTS.md", "libs/sdk/AGENTS.md", "libs/shared/AGENTS.md", "libs/ui/AGENTS.md", "libs/utility/AGENTS.md", "libs/workbench/AGENTS.md", "packages/auditlog/AGENTS.md", "packages/automation/AGENTS.md", "packages/browser-automation/AGENTS.md", "packages/cli/AGENTS.md", "packages/client/AGENTS.md", "packages/playground/AGENTS.md", "packages/terminal/AGENTS.md"], "rule_1": {"path": "libs/panels/AGENTS.md", "start_line": 126, "end_line": 128, "heading": "AGENTS.md - @semoss/panels > Rules", "text": "- **Keep PPTX viewer content lazy-loaded internally.** The manifest exposes only the root,\n  `globals.css`, and `vite` entry points, not a `file-pptx-view-content` public subpath.\n  Do not turn the heavy viewer into an eager public-barrel import.", "section_first_line": 106, "section_last_line": 133, "section_text": "  `use-workbench-file-panels` → `file-panel.components`, and left the file explorer blueprint\n  undefined in every host. The predicate lives in `file-panel.constants.ts`, which imports\n  nothing. `file-panel.components.test.ts` states the invariant, and the playground's\n  `use-sidebar-panel-active.test.tsx` is what actually reproduces a cycle — it enters through\n  the package specifier, the way a host does.\n- **`FILE_PANEL_TYPES` string values are a storage contract.** Changing one breaks cached\n  layouts that reference the old type; preserve compatibility when changing registrations.\n  The client spreads these into its own `WORKBENCH_COMPONENTS`.\n- **`FILE_PANEL_COMPONENTS` defines what \"a file panel\" *is* at runtime.** `useWorkbenchFilePanels`\n  decides which open panels follow a rename by membership in it, never by the shape of a config —\n  the Git panels carry the same `{ type, id, name, path }` fields and were being swept up.\n- **Workbench event names live in `file-panel.constants.ts`, beside the panel types.** That file\n  imports nothing, which is what keeps an event name safe to import from anywhere — the same\n  cycle rule as `isFilePanelType`. The hook that subscribes is an ordinary hook in `hooks/`.\n- **An event with no subscriber does not belong here.** `useFilesChanged` earns its place because\n  four explorers and eight file panels consume it; an event added \"for later\" is surface with no\n  consumer, and the dock's own panel-lifecycle events were deleted for exactly that reason.\n- **Never dereference `a.mode.type` in a blueprint `matches`.** It runs inside `selectPanel`, a\n  store action outside any error boundary; a config it cannot read must return false, not throw.\n  Use `matchesFilePanel`.\n- **Keep PPTX viewer content lazy-loaded internally.** The manifest exposes only the root,\n  `globals.css`, and `vite` entry points, not a `file-pptx-view-content` public subpath.\n  Do not turn the heavy viewer into an eager public-barrel import.\n- **Monaco needs the `monaco-editor` alias.** Every host that renders a file panel aliases the bare\n  specifier at `libs/shared/node_modules/...`; `vite.config.ts` here does the same so the tests run.\n- Everything else about panels — blueprints, mount policy, chrome controls, the dirty `*` marker —\n  is in [the dock's AGENTS.md](../workbench/AGENTS.md) and\n  [the client's host components](../../packages/client/src/components/workbench/)."}, "rule_2": {"path": "libs/ui/AGENTS.md", "start_line": 64, "end_line": 66, "heading": "AGENTS.md - @semoss/ui Component Library > Design Tokens (`src/styles/globals.css`) > `src/next/theme.ts` is dead code — never use it", "text": "`src/next/theme.ts` exports a MUI-shaped `lightTheme`/`darkTheme` palette whose values\ncontradict `globals.css`. It has zero consumers. Never import, extend, or treat it as a token\nsource. Deleting it is planned future work.", "section_first_line": 62, "section_last_line": 66, "section_text": "### `src/next/theme.ts` is dead code — never use it\n\n`src/next/theme.ts` exports a MUI-shaped `lightTheme`/`darkTheme` palette whose values\ncontradict `globals.css`. It has zero consumers. Never import, extend, or treat it as a token\nsource. Deleting it is planned future work."}, "scope_statements": [{"path": "AGENTS.md", "line": 1, "text": "# AGENTS.md - SEMOSS Monorepo"}, {"path": "AGENTS.md", "line": 30, "text": "Read the owning package's `AGENTS.md` and use the [skill index](./skills/README.md)"}, {"path": "AGENTS.md", "line": 81, "text": "[libs/panels/AGENTS.md](./libs/panels/AGENTS.md#what-a-host-has-to-wire-up)."}, {"path": "AGENTS.md", "line": 85, "text": "[libs/connectors/AGENTS.md](./libs/connectors/AGENTS.md#what-a-host-has-to-wire-up)."}, {"path": "AGENTS.md", "line": 140, "text": "See [DESIGN.md](./DESIGN.md) and the [UI component catalog](./libs/ui/AGENTS.md)."}, {"path": "AGENTS.md", "line": 159, "text": "for imports within a package. See [the utility guide](./libs/utility/AGENTS.md)."}, {"path": "AGENTS.md", "line": 160, "text": "- Search individual files, nested functions, callbacks, and repeated expressions as"}, {"path": "AGENTS.md", "line": 174, "text": "- **`*.local`** files - Local environment overrides (gitignored)"}, {"path": "AGENTS.md", "line": 185, "text": "## Nested AGENTS.md Files"}, {"path": "AGENTS.md", "line": 188, "text": "- [libs/utility/AGENTS.md](./libs/utility/AGENTS.md) - Generic utility ownership and public categories"}, {"path": "AGENTS.md", "line": 189, "text": "- [libs/sdk/AGENTS.md](./libs/sdk/AGENTS.md) - Core SDK specifics"}, {"path": "AGENTS.md", "line": 190, "text": "- [libs/ui/AGENTS.md](./libs/ui/AGENTS.md) - Component library specifics"}, {"path": "AGENTS.md", "line": 191, "text": "- [libs/shared/AGENTS.md](./libs/shared/AGENTS.md) - Shared utilities/components specifics"}, {"path": "AGENTS.md", "line": 192, "text": "- [libs/connectors/AGENTS.md](./libs/connectors/AGENTS.md) - Microsoft 365 and Google Workspace viewers"}, {"path": "AGENTS.md", "line": 193, "text": "- [libs/renderer/AGENTS.md](./libs/renderer/AGENTS.md) - Visualization components specifics"}], "full_files": {"libs/panels/AGENTS.md": "# AGENTS.md - @semoss/panels\n\nThe SEMOSS file panels: seven file *views*, the blueprints that mount them in a dock, three\nexplorer variants, the MCP toolbox editor, and the resource-permission cache they read.\n\n> **Inherits from:** [../../AGENTS.md](../../AGENTS.md) (root).\n> Load the applicable [root skills](../../skills/README.md), including the\n> [React standard](../../skills/react-standard.skill.md), for general implementation rules.\n\n## Why this is its own package\n\nThe panels are both dock-aware and SEMOSS-aware, and neither existing lib can hold that:\n\n- `@semoss/shared` would have to depend on `@semoss/workbench`, dragging the dock into every\n  consumer of shared — including ones that never mount one.\n- `@semoss/workbench` cannot take them at all. It exists to be domain-agnostic; these run pixels.\n\nSo the layering is one direction, three layers:\n\n```\n@semoss/ui ← @semoss/workbench ← @semoss/panels → @semoss/shared → @semoss/sdk\n```\n\nNothing here may import from a host (`packages/*`). `zustand` is a **peer** dependency,\nmatching the dock. Hosts supply a compatible version and explicitly share the intended\nstore instances; a peer declaration alone does not guarantee shared state.\n\n## Layout\n\n```\nsrc/\n├── components/\n│   ├── views/  one component per file kind\n│   └── ...     the blueprint factory, the chrome control, explorers, `mcp/` editor UI\n├── contexts/   access provider context\n├── stores/     access store factory\n├── hooks/      access, file-panel, explorer, and MCP hooks\n├── utility/    file-panel and MCP utility functions\n├── types/      access, file-panel, and MCP types\n├── constants/  file-panel runtime constants\n├── styles/     the Tailwind `@source` every host imports\n├── vite/       build-time bits a host cannot skip (see below)\n└── index.ts    curated public surface\n```\n\n`src/vite/` is Node-side and is **not** in the barrel — it has its own `./vite` export subpath.\n\n## Access is provided by the host\n\nPanels call `useAccess(type, id)`, which reads whatever store the nearest `AccessStoreProvider`\ncarries. The contract is structural (`StoreApi<PermissionCache>`) so a host can fold the cache into\na bigger store:\n\n- **The client** folds `createPermissionCache` into its session store, so permissions sit beside\n  the user they belong to and are **cleared on logout** — without that, one user's `OWNER` survives\n  into the next user's session in the same tab.\n- **A host with no session** (the playground, a test) mounts `createAccessStore()`.\n\nWorth knowing when reasoning about cost: an `INSIGHT` permission resolves to `\"EDIT\"` with no\nnetwork call at all.\n\n`file-explorer-control.tsx` reads `state.permissions[key]` directly rather than through\n`useAccess`. That is deliberate — a chrome control renders outside its panel's subtree, so it\ncannot reuse the access the panel already resolved.\n\n## A host can add right-click entries to the explorer\n\n`FILE_EXPLORER_PANEL` asks the nearest `FileExplorerHostProvider` for extra entries per row\n(`secondaryActions(item, mode)`), so an app adds its own actions without forking the blueprint.\nThe playground adds Add to Context to Chat Files this way. Entries with `placement: \"end\"` are\nlisted after every standard entry. Keep the host object's identity stable: it is a dependency of\nevery row's actions.\n\n## A view renders a file; a host draws its actions\n\n`components/views/` holds one component per `FileEditorKind`. A view owns the read, the buffer\nand its own view switch, and renders the file and nothing else. It publishes what it can do\n(`FileViewControls`) through `onControls`, and its host draws that.\n\n`createFileViewPanel({ name, view })` is the only host today: it wraps a view as a\n`WorkbenchPanelConfig`, republishes the controls as the panel's scratch value, registers\n`FileViewControl` so they appear in the tab strip, and subscribes to `FILES_CHANGED`. The\nblueprints are a table in `file-panel.components.ts`; there are no per-panel files.\n\nThe split is still worth keeping: a view calls no `useWorkbench*` hook, so a host that is not a\ndock can mount one by supplying its own chrome and skipping `useFilesChanged`.\n\n## Rules\n\n- **A file view never calls a `useWorkbench*` hook.** They throw outside a provider, and both\n  hosts mount the same views. Anything dock-shaped belongs in `createFileViewPanel`.\n- **`src/index.ts` is curated, not `export *`.** Of the sixty symbols the source tree used to\n  leak, eight had an external consumer. Panel blueprints are not among them — a host registers\n  `FILE_PANEL_COMPONENTS`. Add a symbol when a consumer needs it; `export *` also put\n  `getImageMimeType(path)` next to `@semoss/shared`'s incompatible `getImageMimeType(extension)`\n  in any barrel that re-exported both.\n- **`useFilePanel` and `useFileBuffer` are public**, for a host whose editor needs chrome of its\n  own. `packages/terminal` builds on them: its editor carries a Run toolbar and a scope guard,\n  and the dock allows one control per panel, so it cannot inherit the code editor's blueprint\n  wholesale. That is the supported way to reuse the access/read/save/dirty machinery.\n- **Nothing a panel imports may import `file-panel.components.ts`.** It is an object literal\n  over every blueprint, so a module still initializing when it is built lands in the map as\n  `undefined` — the dock then renders \"no component registered\" and `matches` silently falls\n  back to a shallow compare, with nothing thrown. That is exactly what homing `isFilePanelType`\n  there did: it closed the cycle `file-panel.components` → `file-explorer-panel` →\n  `use-workbench-file-panels` → `file-panel.components`, and left the file explorer blueprint\n  undefined in every host. The predicate lives in `file-panel.constants.ts`, which imports\n  nothing. `file-panel.components.test.ts` states the invariant, and the playground's\n  `use-sidebar-panel-active.test.tsx` is what actually reproduces a cycle — it enters through\n  the package specifier, the way a host does.\n- **`FILE_PANEL_TYPES` string values are a storage contract.** Changing one breaks cached\n  layouts that reference the old type; preserve compatibility when changing registrations.\n  The client spreads these into its own `WORKBENCH_COMPONENTS`.\n- **`FILE_PANEL_COMPONENTS` defines what \"a file panel\" *is* at runtime.** `useWorkbenchFilePanels`\n  decides which open panels follow a rename by membership in it, never by the shape of a config —\n  the Git panels carry the same `{ type, id, name, path }` fields and were being swept up.\n- **Workbench event names live in `file-panel.constants.ts`, beside the panel types.** That file\n  imports nothing, which is what keeps an event name safe to import from anywhere — the same\n  cycle rule as `isFilePanelType`. The hook that subscribes is an ordinary hook in `hooks/`.\n- **An event with no subscriber does not belong here.** `useFilesChanged` earns its place because\n  four explorers and eight file panels consume it; an event added \"for later\" is surface with no\n  consumer, and the dock's own panel-lifecycle events were deleted for exactly that reason.\n- **Never dereference `a.mode.type` in a blueprint `matches`.** It runs inside `selectPanel`, a\n  store action outside any error boundary; a config it cannot read must return false, not throw.\n  Use `matchesFilePanel`.\n- **Keep PPTX viewer content lazy-loaded internally.** The manifest exposes only the root,\n  `globals.css`, and `vite` entry points, not a `file-pptx-view-content` public subpath.\n  Do not turn the heavy viewer into an eager public-barrel import.\n- **Monaco needs the `monaco-editor` alias.** Every host that renders a file panel aliases the bare\n  specifier at `libs/shared/node_modules/...`; `vite.config.ts` here does the same so the tests run.\n- Everything else about panels — blueprints, mount policy, chrome controls, the dirty `*` marker —\n  is in [the dock's AGENTS.md](../workbench/AGENTS.md) and\n  [the client's host components](../../packages/client/src/components/workbench/).\n\n## What a host has to wire up\n\nThree things, each of which fails quietly or late if it is missed:\n\n| | Why |\n|---|---|\n| `@import \"@semoss/panels/globals.css\"` (and the dock's) | Tailwind only generates classes it has scanned. A package outside the host's `@source` globs contributes none, and a missing utility renders as an unstyled panel — never a build error. |\n| `aiSdkStubAlias` from `@semoss/panels/vite` | `pptx-react-viewer` imports the `ai` package (its unused AI chat panel). It is an optional peer and is not installed, so without the stub the **build fails outright**. |\n| `scopePptxViewerCssPlugin` from `@semoss/panels/vite` | The viewer ships its own Tailwind build emitting the same class and token names as the host's. Unscoped, whichever sheet loads last restyles the whole document. |\n\nPlus the `monaco-editor` alias above. All of it lives here rather than in each host's\n`vite.config.ts`, so adding a third host is an import rather than an archaeology exercise.\n\n## Validation\n\nThis package is source-only; it has no build script. From the repository root:\n\n```bash\npnpm --filter @semoss/panels check-types\npnpm --filter @semoss/panels test\n```\n\nAlso exercise an affected host when changing its panel or Vite integration.\n\n## Generic utilities\n\nImport reusable helpers from `@semoss/utility/<category>`, a direct workspace dependency.\nFollow the [utility guide](../utility/AGENTS.md). Keep domain policy and\nUI behavior here, and preserve public compatibility adapters when moving helpers.\n", "libs/ui/AGENTS.md": "# AGENTS.md - @semoss/ui Component Library\n\nThis document provides context for AI coding assistants working with the SEMOSS UI component library.\n\n> **Inherits from:** [root AGENTS.md](../../AGENTS.md). Load the applicable\n> [root skills](../../skills/README.md), including the [React standard](../../skills/react-standard.skill.md)\n> for implementation and the accessibility/form/mobile skills for relevant UI work.\n> Repo-wide design rules live in [../../DESIGN.md](../../DESIGN.md).\n\n## Overview\n\n`@semoss/ui` is the **single source of truth for design** in this monorepo:\n\n- **shadcn/ui** + **Radix UI** primitives, styled with **Tailwind CSS v4** (CSS-first — there\n  is no `tailwind.config.*` anywhere in the repo).\n- All design tokens live in [src/styles/globals.css](src/styles/globals.css) and are consumed\n  by every app via `@import \"@semoss/ui/globals.css\";`.\n- All shared components live in [src/next/](src/next/) and are imported by consumers **only**\n  as `@semoss/ui/next`.\n\n> **Conventions:** `@semoss/ui` is the **exception** to the root \"one component per file\" rule\n> — related components are colocated in a file (e.g. `Card` + `CardHeader` + `CardContent`).\n\n## Design Tokens (`src/styles/globals.css`)\n\nTokens are raw values on `:root` (light) and `.dark` (dark), mapped to Tailwind utilities via\n`@theme inline`. Token consumption and definition exceptions follow\n[DESIGN.md](../../DESIGN.md#carve-outs-enumerated--nothing-else-is-exempt).\n\n### Semantic colors\n\n| Token | Utility examples | Use for |\n|-------|------------------|---------|\n| `background` / `foreground` | `bg-background`, `text-foreground` | Page surface and default text |\n| `card` / `card-foreground` | `bg-card`, `text-card-foreground` | Card surfaces |\n| `popover` / `popover-foreground` | `bg-popover` | Popovers, dropdowns, menus |\n| `primary` / `primary-foreground` | `bg-primary`, `text-primary` | Brand blue; primary actions, links |\n| `assistant` / `assistant-foreground` | `Button variant=\"assistant\"` | Purple assistant actions, such as Ask Assistant |\n| `muted` / `muted-foreground` | `bg-muted`, `text-muted-foreground` | De-emphasized text/surfaces |\n| `accent` / `accent-foreground` | `hover:bg-accent` | Hover/active tints |\n| `destructive` / `destructive-foreground` | `text-destructive`, `bg-destructive/10` | Errors, dangerous actions |\n| `success` / `success-foreground` | `text-success`, `bg-success/10` | Success/positive status |\n| `warning` / `warning-foreground` | `text-warning`, `bg-warning/10` | Warning/caution status |\n| `border` / `input` / `ring` / `ring-offset` | `border-border`, `ring-ring/50` | Borders, input outlines, focus rings |\n| `chart-1` … `chart-5` | `bg-chart-1`, `text-chart-2` | Data visualization series colors |\n| `sidebar-*` | `bg-sidebar`, `border-sidebar-border` | Sidebar chrome (8 tokens) |\n| `login-*` | — | Login page skin only |\n\nStatus colors are **only** `destructive`, `success`, and `warning`. There is no `info` token —\npropose one before inventing blue status styling.\n\n### Other tokens\n\n- **Radius**: `--radius: 0.625rem`, exposed as `rounded-sm/md/lg/xl`.\n- **Fonts**: `--font-sans` (Geist), `--font-mono` (Geist Mono) → `font-sans`, `font-mono`.\n- **Type scale**: the full Tailwind scale (`--text-xs` … `--text-9xl`, weights, tracking,\n  leading) is re-declared as runtime CSS variables so it can be read at runtime.\n- **Heading/section utilities**: `.heading-xl/lg/md/sm`, `.container-padding-x`,\n  `.section-padding-y`, `.section-title-gap-*` — responsive classes defined in `@layer base`.\n- **Spacing**: no custom scale; use Tailwind defaults on an 8px rhythm (`gap-2`, `p-4`).\n\n### `src/next/theme.ts` is dead code — never use it\n\n`src/next/theme.ts` exports a MUI-shaped `lightTheme`/`darkTheme` palette whose values\ncontradict `globals.css`. It has zero consumers. Never import, extend, or treat it as a token\nsource. Deleting it is planned future work.\n\n## Component Inventory (`src/next/`, imported as `@semoss/ui/next`)\n\n- **Buttons & actions**: `Button` (+`buttonVariants`), `ButtonGroup`, `Toggle`, `ToggleGroup`\n- **Inputs & forms**: `Input`, `Textarea`, `Checkbox`, `RadioGroup`, `Select`, `Slider`,\n  `Switch`, `Label`, `Calendar`, `FileDropzone`, `InputGroup`, `Field` (+ `FieldLabel`,\n  `FieldError`, …)\n- **Layout**: `Card`, `Separator`, `ScrollArea`, `Resizable*`, `Collapsible`, `Item`,\n  `Sidebar` (+ `SidebarProvider`, `useSidebar`, …)\n- **Typography**: `H1`, `H2`, `H3`, `H4`, `Lead`, `P`, `Large`, `Small`, `Muted`,\n  `InlineCode`, `MultilineCode`, `List`, `Quote`\n- **Feedback**: `Alert`, `toast` + `Toaster` (sonner), `Progress`, `Skeleton`, `Spinner`,\n  `LoadingScreen`\n- **Overlays**: `Dialog`, `Sheet`, `Drawer`, `Popover`, `HoverCard`, `Tooltip`,\n  `DropdownMenu`, `ContextMenu`, `Command`\n- **Data display**: `Table`, `TreeView`, `Badge` (+`badgeVariants`), `Avatar`, `Accordion`,\n  `Code`, `Markdown`\n- **Navigation**: `Breadcrumb`, `Pagination`, `Tabs`, `Stepper`\n- **Theming**: `ThemeProvider`, `useTheme` (`\"dark\" | \"light\" | \"system\"`)\n- **Utilities & hooks**: `cn`, `useCacheState`, `useDebouncedCallback`, `useDebouncedValue`,\n  `useInfiniteScroll`, `useIsMobile`\n\n`Progress` reports its value as the bar's `aria-valuenow`, kept between 0 and `max` (100 by\ndefault); with no value it is indeterminate. Give it an `aria-label`, and an `aria-valuetext`\nwhen a bare percentage does not say what it measures.\n\n### Typography map\n\nThere is **no** `<Typography variant=\"...\">` component. Use the discrete components:\n\n| Component | Element | Use for |\n|-----------|---------|---------|\n| `H1`–`H4` | `h1`–`h4` | Headings (bold/semibold, 4xl→xl) |\n| `Lead` | `p` | Intro/subtitle text (muted, xl) |\n| `P` | `p` | Body text |\n| `Large` / `Small` | `div` / `p` | Emphasized / fine-print text |\n| `Muted` | `span` | Secondary/hint text |\n| `InlineCode` / `MultilineCode` | `code` / `pre` | Code snippets |\n| `List` / `Quote` | `ul` / `blockquote` | Lists / block quotes |\n\n### Import rules for consumers\n\n```typescript\n// The only sanctioned import path — components, hooks, and cn():\nimport { Button, H2, Muted, cn, toast } from \"@semoss/ui/next\";\n```\n\n```css\n/* Once per app, at the top of its index.css: */\n@import \"@semoss/ui/globals.css\";\n```\n\n- The bare `@semoss/ui` barrel currently re-exports `./next`; the supported design-system\n  convention for consumers is `@semoss/ui/next`.\n- The `@/*` alias (e.g. `@/lib/utils`) is **internal to this lib** — consumers must never\n  use it.\n\n## shadcn/ui Configuration\n\nFrom `components.json`:\n- **Style**: new-york\n- **Base color**: zinc\n- **CSS variables**: enabled\n- **Icon library**: lucide-react\n\n## Authoring Pattern\n\nEvery component in `src/next/` follows the same conventions — match them exactly when adding\nor editing components:\n\n```typescript\nimport { cn } from \"@/lib/utils\";               // internal alias, lib-only\nimport { cva, type VariantProps } from \"class-variance-authority\";\n\nconst buttonVariants = cva(\n    \"inline-flex items-center justify-center gap-2 rounded-md text-sm font-medium ...\",\n    {\n        variants: {\n            variant: {\n                default: \"bg-primary text-primary-foreground hover:bg-primary/90\",\n                destructive: \"bg-destructive ...\",\n                outline: \"border bg-background hover:bg-accent ...\",\n                // secondary | ghost | link\n            },\n            size: { default: \"h-9 px-4 py-2\", sm: \"...\", lg: \"...\", icon: \"size-9\" },\n        },\n        defaultVariants: { variant: \"default\", size: \"default\" },\n    },\n);\n```\n\n- **CVA** for variants; variant names stay consistent across components\n  (`default | destructive | outline | secondary | ghost | link`; sizes `default | sm | lg | icon`).\n- **`data-slot=\"<name>\"`** attribute on every root and sub-part (used as styling hooks, e.g.\n  `has-data-[slot=card-action]:grid-cols-[1fr_auto]`).\n- Apply [DESIGN.md](../../DESIGN.md) for token and styling rules.\n- `asChild?: boolean` + Radix `Slot` for polymorphic components.\n- `className` is always the **last** argument to `cn(...)` so callers can override.\n- Export public components together with their `xVariants`, following the React skill's\n  [export policy](../../skills/react-standard.skill.md#architecture-and-exports).\n- Colocate related sub-components in the same file.\n\n### The `cn()` Utility\n\n```typescript\n// Combines clsx + tailwind-merge — use for ALL className composition\n<div className={cn(\"base-class\", conditional && \"conditional-class\", className)} />\n```\n\n**Location**: `src/lib/utils.ts` (internal import `@/lib/utils`); re-exported to consumers\nthrough `@semoss/ui/next`.\n\n## Structure\n\n```\nsrc/\n├── next/            # All components (shadcn/Radix style, flat kebab-case files)\n│   └── index.ts     # Public component entry point\n├── hooks/           # Shared React hooks\n├── lib/             # Utilities (cn, etc.)\n├── styles/          # globals.css — the design-token source of truth\n└── index.ts         # Re-exports ./next\n```\n\n## Build System\n\n- **Bundler**: Vite 8 library build\n- **Output**: ES modules (`dist/index.mjs`, `dist/next.mjs`)\n- **Types**: TypeScript declarations (`dist/types/`)\n- **Styles**: `@semoss/ui/globals.css` exports `src/styles/globals.css` directly;\n  consumers process it with their Tailwind setup.\n\n### Commands\n\n| Command | Description |\n|---------|-------------|\n| `pnpm dev` | Watch mode with Vite (`vite build --watch`) |\n| `pnpm build` | Production build |\n| `pnpm build:dev` | Development build |\n\nRun these commands from `libs/ui`, or use `pnpm --filter @semoss/ui <command>` from the root.\n\n## Key Dependencies\n\n- **Radix UI**: Accessible primitives (dialog, dropdown, select, etc.)\n- **class-variance-authority**: Component variants\n- **lucide-react**: Icon library\n- **tailwind-merge** + **clsx**: `cn()` class merging\n- **`@shikijs/*`**: Code syntax highlighting\n- **Peer dependencies**: React and React DOM `^18.3.1 || ^19.0.0`, plus\n  `react-hook-form`, `@hookform/resolvers`, and `zod`. Keep consumers compatible with\n  the ranges in `package.json`.\n\n## Agent Guardrails\n\n### Do Not Modify\n\n- **`dist/`** - Build output, regenerated on build\n- **Peer dependency versions** - Must stay synchronized with consuming packages\n\n### Be Cautious With\n\n- **`src/next/index.ts` / `src/index.ts`** - Main exports, affect all consumers\n- **`src/styles/globals.css`** - Token changes affect every app; adding a token requires\n  light + dark values and an `@theme inline` mapping\n- **`vite.config.ts`** - Build configuration\n- **`components.json`** - shadcn CLI configuration\n\n### When Adding Components\n\n1. Add the component to `src/next/` (flat kebab-case file)\n2. Follow the authoring pattern above (CVA + `data-slot` + Radix + tokens)\n3. Add the export to `src/next/index.ts`\n4. Use `cn()` for all className composition\n5. Reuse existing variant/size names before inventing new ones\n\n### Testing Components\n\n```bash\npnpm --filter @semoss/ui build\n```\n\nThen test in a consuming package:\n```bash\npnpm --filter @semoss/playground dev\n```\n"}}}, {"item_id": "c0a6bfc", "practice": false, "task": "Make a small fix in `packages/browser-automation/src/vite-env.d.ts` and complete the checks this change requires before committing.", "target_path": "packages/browser-automation/src/vite-env.d.ts", "repo": "SEMOSS/semoss-ui", "commit": "535fc9a41111c739473142cebf1872b8980619ed", "packet": {"agents_paths": ["AGENTS.md", "libs/connectors/AGENTS.md", "libs/i18n/AGENTS.md", "libs/panels/AGENTS.md", "libs/renderer/AGENTS.md", "libs/sdk/AGENTS.md", "libs/shared/AGENTS.md", "libs/ui/AGENTS.md", "libs/utility/AGENTS.md", "libs/workbench/AGENTS.md", "packages/auditlog/AGENTS.md", "packages/automation/AGENTS.md", "packages/browser-automation/AGENTS.md", "packages/cli/AGENTS.md", "packages/client/AGENTS.md", "packages/playground/AGENTS.md", "packages/terminal/AGENTS.md"], "rule_1": {"path": "libs/sdk/AGENTS.md", "start_line": 92, "end_line": 96, "heading": "AGENTS.md - @semoss/sdk > Agent Guardrails > Testing Changes", "text": "For documentation-only edits, check local links, skill metadata, package inclusion,\nand examples against source exports/types. Run focused tests for lifecycle claims;\ndo not present those checks as backend integration verification. Follow the\n[repository validation guidance](../../skills/react-standard.skill.md#validation),\nwith [biome.json](../../biome.json) as lint/formatting authority.", "section_first_line": 83, "section_last_line": 96, "section_text": "### Testing Changes\n\nFor SDK source changes, run the relevant tests first, then the package gates:\n\n```bash\npnpm --filter @semoss/sdk test\npnpm --filter @semoss/sdk build\n```\n\nFor documentation-only edits, check local links, skill metadata, package inclusion,\nand examples against source exports/types. Run focused tests for lifecycle claims;\ndo not present those checks as backend integration verification. Follow the\n[repository validation guidance](../../skills/react-standard.skill.md#validation),\nwith [biome.json](../../biome.json) as lint/formatting authority."}, "rule_2": {"path": "packages/browser-automation/AGENTS.md", "start_line": 37, "end_line": 40, "heading": "AGENTS.md - @semoss/browser-automation > Build System > Linting", "text": "Follow the [React validation guidance](../../skills/react-standard.skill.md#validation).\nThe manifest declares `lint: eslint .`, but this package has no `eslint.config.js` and no\nrepository-root config to inherit. Treat ESLint validation as blocked until the package\nconfiguration is repaired in a separately authorized change; do not report it
