kground/README.md` and complete the checks this change requires.", "target_path": "docs/background/README.md", "repo": "dartsim/dart", "commit": "738349bd45477c5eeadd128f85ec66dfc34f195d", "packet": {"agents_paths": ["AGENTS.md", "docs/AGENTS.md", "docs/background/AGENTS.md", "docs/design/AGENTS.md", "docs/plans/AGENTS.md"], "rule_1": {"path": "docs/background/AGENTS.md", "start_line": 25, "end_line": 26, "heading": "docs/background/ > Verification", "text": "Use `docs/ai/verification.md` to select gates. For background-only Markdown\nedits, run `pixi run lint`.", "section_first_line": 23, "section_last_line": 26, "section_text": "## Verification\n\nUse `docs/ai/verification.md` to select gates. For background-only Markdown\nedits, run `pixi run lint`."}, "rule_2": {"path": "AGENTS.md", "start_line": 124, "end_line": 125, "heading": "Agent Guidelines for DART > Before Every Commit", "text": "- Run `pixi run build` and focused tests when C++ or Python behavior changes;\n  GUI changes also run `pixi run test-gui`.", "section_first_line": 121, "section_last_line": 131, "section_text": "## Before Every Commit\n\n- Run `pixi run lint`, even for docs-only changes.\n- Run `pixi run build` and focused tests when C++ or Python behavior changes;\n  GUI changes also run `pixi run test-gui`.\n- Use `dart-changelog` to decide whether `CHANGELOG.md` needs an entry.\n- Promote durable facts and remove a completing `docs/dev_tasks/<task>/` folder.\n- Run `pixi run install-hooks` once per clone. Its fast staged safety check is\n  not a substitute for the full lint requirement. When it blocks a commit, fix\n  the reported failure; `DART_SKIP_HOOKS=1` is a maintainer emergency bypass\n  to use only when a maintainer explicitly asks."}, "scope_statements": [{"path": "AGENTS.md", "line": 45, "text": "| Documentation placement              | `docs/README.md`, `docs/information-architecture.md`, `docs/AGENTS.md`                                |"}, {"path": "AGENTS.md", "line": 55, "text": "Subdirectories may provide a closer `AGENTS.md`; instructions accumulate from"}, {"path": "docs/AGENTS.md", "line": 9, "text": "1. Root `AGENTS.md`"}, {"path": "docs/AGENTS.md", "line": 12, "text": "4. The local folder `README.md` or `AGENTS.md` for the surface you are editing"}, {"path": "docs/AGENTS.md", "line": 49, "text": "`AGENTS.md`."}], "full_files": {"AGENTS.md": "# Agent Guidelines for DART\n\nThis file is the single shared rules file and repository pointer board for\nClaude Code, Codex, and Muse; keep shared guidance here (see\n`docs/onboarding/ai-tools.md`). Start every task with\n`docs/ai/principles.md`, then load only the owner docs needed for the work.\nDelegate by default under `docs/ai/orchestration.md`; honor a per-task\n`delegation=off` opt-out.\n\n@docs/ai/principles.md\n\n## Project Profile\n\n- **WHAT**: C++17 robotics physics engine with dartpy bindings (nanobind)\n- **WHY**: A Python-first DART 7 that stays compatible with Gazebo/gz-physics\n- **HOW**: Use repository `pixi run ...` tasks; run `pixi run lint` before commits\n\n## Quick Commands\n\n```bash\npixi run config       # Configure the default CMake/Ninja build\npixi run build        # Build C++ libraries and utilities\npixi run test         # Build and run C++ tests\npixi run build-py-dev # Build dartpy\npixi run test-py      # Run dartpy tests\npixi run test-all     # Build defaults and run C++/Python tests\npixi run test-gui     # Run Filament GUI tests that need a graphics device\npixi run lint         # Format code, docs, TOML, and spelling (auto-fixes)\npixi run check-lint   # Run the non-mutating lint aggregate\n```\n\nFor downstream-sensitive changes, also run `pixi run -e gazebo test-gz`.\nSee `docs/onboarding/ci-cd.md` when a gate fails.\n\n## Task-specific Context\n\n| Task                                 | Load these owners                                                                                     |\n| ------------------------------------ | ----------------------------------------------------------------------------------------------------- |\n| Any task                             | `docs/ai/principles.md`                                                                               |\n| Architecture or component boundaries | `docs/onboarding/architecture.md`                                                                     |\n| Building or dependencies             | `docs/onboarding/building.md`, `docs/onboarding/build-system.md`                                      |\n| Testing or simulation evidence       | `docs/onboarding/testing.md`, `docs/ai/verification.md`; use `dart-verify-sim`                        |\n| Performance investigations or claims | `docs/onboarding/profiling.md` § \"Performance Methodology\"; use `dart-perf` |\n| Contribution, branches, or style     | `docs/onboarding/contributing.md`, `docs/onboarding/code-style.md`, `CONTRIBUTING.md`                 |\n| Documentation placement              | `docs/README.md`, `docs/information-architecture.md`, `docs/AGENTS.md`                                |\n| AI workflows or tooling              | `docs/ai/README.md`, `docs/ai/workflows.md`, `docs/ai/terminology.md`, `docs/onboarding/ai-tools.md`  |\n| Planning or autonomous work          | `docs/ai/north-star.md`, `docs/plans/dashboard.md`, `docs/ai/orchestration.md`, `docs/ai/sessions.md` |\n| CI failures                          | `docs/onboarding/ci-cd.md`                                                                            |\n| Python bindings                      | `docs/onboarding/python-bindings.md`                                                                  |\n| Model loading and parsers            | `docs/onboarding/io-parsing.md`                                                                       |\n| Release maintenance                  | `docs/onboarding/release-management.md`                                                               |\n| Changelog decisions                  | `docs/onboarding/changelog.md`, `docs/onboarding/release-management.md`                               |\n| Multi-session dev tasks              | `docs/dev_tasks/README.md`                                                                            |\n\nSubdirectories may provide a closer `AGENTS.md`; instructions accumulate from\nthe repository root to the working directory.\n\n## Compatibility Rules\n\n- Branch from the resolved target into a non-tracking topic branch\n  (`origin/main` by default); never commit directly to `main` or `release-*`.\n- `main` is the Python-first DART 7 line ([PLAN-624](docs/plans/dashboard.md));\n  `release-6.20` is the DART 6 maintenance line and keeps its own checkout's rules.\n- On `main`, preserve C++17, the nanobind binder, `dart::utils` parsers, Filament,\n  installed headers, package components (including legacy forwarding components),\n  and source and behavior compatibility of the C++ API used by Gazebo/gz-physics\n  and gz-sim. PLAN-624 approves the dartpy clean break, the OSG-to-Filament\n  renderer replacement merged in #3696, labeled default-behavior changes\n  behind its gates, and, until 7.0.0 is packaged, ABI-layout changes in classes\n  Gazebo neither subclasses nor reads, gated by the API inventory check and the\n  unpatched Gazebo lanes; any other public-API, ABI-layout, or default-behavior\n  change needs maintainer approval.\n- dartpy uses nanobind as its only binder, under `python/dartpy/`; follow\n  `docs/onboarding/python-bindings.md`.\n- New fixes land on `main`; backports to a `release-*` branch use\n  `dart-backport-pr`. Target the release branch for release-specific packaging,\n  CI, and branch guidance. Resolve the next release and milestone from the\n  fetched target's `docs/onboarding/release-management.md`.\n- Use `.github/PULL_REQUEST_TEMPLATE.md` and set the resolved release milestone\n  on PRs.\n- Do not prefix commit messages or PR titles with agent tags like `[codex]`;\n  use plain descriptive titles.\ , as DART-generated output: preserve unrelated skills in the\nshared `.agents/skills/` directory, and let sync remove only\nmanifest-owned paths.\n\n```bash\npixi run sync-ai-commands\npixi run check-ai-commands\npixi run python scripts/setup_ai.py\npixi run python scripts/check_ai_infrastructure.py --doctor\n```\n\nUnder Muse's default shell sandbox, `.git/` and `.agents/` stay\nread-only, so run Git mutations (switch, commit, merge) and\n`sync-ai-commands` from an unsandboxed shell there (see\n`docs/onboarding/ai-tools.md`).\n\nUse `$dart-ultrawork` in Codex or `/dart-ultrawork` in Claude and Muse\nCode for large, multi-session, or explicitly autonomous work. Its\nproject home is `docs/dev_tasks/<task>/`.\n\n## Before Every Commit\n\n- Run `pixi run lint`, even for docs-only changes.\n- Run `pixi run build` and focused tests when C++ or Python behavior changes;\n  GUI changes also run `pixi run test-gui`.\n- Use `dart-changelog` to decide whether `CHANGELOG.md` needs an entry.\n- Promote durable facts and remove a completing `docs/dev_tasks/<task>/` folder.\n- Run `pixi run install-hooks` once per clone. Its fast staged safety check is\n  not a substitute for the full lint requirement. When it blocks a commit, fix\n  the reported failure; `DART_SKIP_HOOKS=1` is a maintainer emergency bypass\n  to use only when a maintainer explicitly asks.\n", "docs/plans/AGENTS.md": "# docs/plans/\n\nAgent rules for DART living plan documents.\n\n## Purpose\n\n`docs/plans/` connects the branch's north star to executable roadmap choices.\nThese files are living planning docs, not archival status dumps and not\nimplementation trackers.\n\n## Rules\n\n- Start with `docs/ai/north-star.md`, then `docs/plans/README.md`.\n- Keep plans concise and evidence-based; link deeper design rationale to\n  `docs/design/` and active implementation detail to `docs/dev_tasks/`.\n- Keep `dashboard.md` as the single source of truth for priority, status,\n  horizon, dimension, next step, and gate of operating plans.\n- Prefer linking existing active dev-task owners over duplicating their packet\n  boards in `docs/plans/`.\n- Put durable architecture/API tradeoffs in `docs/design/`, landed maintainer\n  guidance in `docs/onboarding/`, theory/reference material in\n  `docs/background/`, user instructions in `docs/readthedocs/`, and active\n  handoff state in `docs/dev_tasks/`.\n- Every plan needs compatibility evidence for its target branch.\n\n## Verification\n\nUse `docs/ai/verification.md` to select gates. For plan-only Markdown edits,\nrun `pixi run lint`.\n"}}}, {"item_id": "c6e6602", "practice": false, "task": "Revise one section of `docs/plans/north-star-roadmap.md` and complete the checks this change requires.", "target_path": "docs/plans/north-star-roadmap.md", "repo": "dartsim/dart", "commit": "738349bd45477c5eeadd128f85ec66dfc34f195d", "packet": {"agents_paths": ["AGENTS.md", "docs/AGENTS.md", "docs/background/AGENTS.md", "docs/design/AGENTS.md", "docs/plans/AGENTS.md"], "rule_1": {"path": "AGENTS.md", "start_line": 128, "end_line": 131, "heading": "Agent Guidelines for DART > Before Every Commit", "text": "- Run `pixi run install-hooks` once per clone. Its fast staged safety check is\n  not a substitute for the full lint requirement. When it blocks a commit, fix\n  the reported failure; `DART_SKIP_HOOKS=1` is a maintainer emergency bypass\n  to use only when a maintainer explicitly asks.", "section_first_line": 121, "section_last_line": 131, "section_text": "## Before Every Commit\n\n- Run `pixi run lint`, even for docs-only changes.\n- Run `pixi run build` and focused tests when C++ or Python behavior changes;\n  GUI changes also run `pixi run test-gui`.\n- Use `dart-changelog` to decide whether `CHANGELOG.md` needs an entry.\n- Promote durable facts and remove a completing `docs/dev_tasks/<task>/` folder.\n- Run `pixi run install-hooks` once per clone. Its fast staged safety check is\n  not a substitute for the full lint requirement. When it blocks a uild C++ libraries and utilities\npixi run test         # Build and run C++ tests\npixi run build-py-dev # Build dartpy\npixi run test-py      # Run dartpy tests\npixi run test-all     # Build defaults and run C++/Python tests\npixi run test-gui     # Run Filament GUI tests that need a graphics device\npixi run lint         # Format code, docs, TOML, and spelling (auto-fixes)\npixi run check-lint   # Run the non-mutating lint aggregate\n```\n\nFor downstream-sensitive changes, also run `pixi run -e gazebo test-gz`.\nSee `docs/onboarding/ci-cd.md` when a gate fails.\n\n## Task-specific Context\n\n| Task                                 | Load these owners                                                                                     |\n| ------------------------------------ | ----------------------------------------------------------------------------------------------------- |\n| Any task                             | `docs/ai/principles.md`                                                                               |\n| Architecture or component boundaries | `docs/onboarding/architecture.md`                                                                     |\n| Building or dependencies             | `docs/onboarding/building.md`, `docs/onboarding/build-system.md`                                      |\n| Testing or simulation evidence       | `docs/onboarding/testing.md`, `docs/ai/verification.md`; use `dart-verify-sim`                        |\n| Performance investigations or claims | `docs/onboarding/profiling.md` § \"Performance Methodology\"; use `dart-perf` |\n| Contribution, branches, or style     | `docs/onboarding/contributing.md`, `docs/onboarding/code-style.md`, `CONTRIBUTING.md`                 |\n| Documentation placement              | `docs/README.md`, `docs/information-architecture.md`, `docs/AGENTS.md`                                |\n| AI workflows or tooling              | `docs/ai/README.md`, `docs/ai/workflows.md`, `docs/ai/terminology.md`, `docs/onboarding/ai-tools.md`  |\n| Planning or autonomous work          | `docs/ai/north-star.md`, `docs/plans/dashboard.md`, `docs/ai/orchestration.md`, `docs/ai/sessions.md` |\n| CI failures                          | `docs/onboarding/ci-cd.md`                                                                            |\n| Python bindings                      | `docs/onboarding/python-bindings.md`                                                                  |\n| Model loading and parsers            | `docs/onboarding/io-parsing.md`                                                                       |\n| Release maintenance                  | `docs/onboarding/release-management.md`                                                               |\n| Changelog decisions                  | `docs/onboarding/changelog.md`, `docs/onboarding/release-management.md`                               |\n| Multi-session dev tasks              | `docs/dev_tasks/README.md`                                                                            |\n\nSubdirectories may provide a closer `AGENTS.md`; instructions accumulate from\nthe repository root to the working directory.\n\n## Compatibility Rules\n\n- Branch from the resolved target into a non-tracking topic branch\n  (`origin/main` by default); never commit directly to `main` or `release-*`.\n- `main` is the Python-first DART 7 line ([PLAN-624](docs/plans/dashboard.md));\n  `release-6.20` is the DART 6 maintenance line and keeps its own checkout's rules.\n- On `main`, preserve C++17, the nanobind binder, `dart::utils` parsers, Filament,\n  installed headers, package components (including legacy forwarding components),\n  and source and behavior compatibility of the C++ API used by Gazebo/gz-physics\n  and gz-sim. PLAN-624 approves the dartpy clean break, the OSG-to-Filament\n  renderer replacement merged in #3696, labeled default-behavior changes\n  behind its gates, and, until 7.0.0 is packaged, ABI-layout changes in classes\n  Gazebo neither subclasses nor reads, gated by the API inventory check and the\n  unpatched Gazebo lanes; any other public-API, ABI-layout, or default-behavior\n  change needs maintainer approval.\n- dartpy uses nanobind as its only binder, under `python/dartpy/`; follow\n  `docs/onboarding/python-bindings.md`.\n- New fixes land on `main`; backports to a `release-*` branch use\n  `dart-backport-pr`. Target the release branch for release-specific packaging,\n  CI, and branch guidance. Resolve the next release and milestone from the\n  fetched target's `docs/onboarding/release-management.md`.\n- Use `.github/PULL_REQUEST_TEMPLATE.md` and set the resolved release milestone\n  on PRs.\n- Do not prefix commit messages or PR titles with agent tags like `[codex]`;\n  use plain descriptive titles.\n- Keep private, local, and machine-specific paths out of published files,\n  commit messages, and PR text; validate with `scripts/check_local_paths.py`.\n- Before every approved push to a published PR branch, first merge the latest\n  base branch into it — merge, never rebase a published PR branch.\n- GitHub mutations, pushes, PR changes, CI reruns, review-thread mutations, and\n  branch deletion require explicit maintainer/user approval.\n- Open PRs as drafts, then mark them ready and merge them only as\n  `docs/onboarding/ai-tools.md` § \"PR Lifecycle\" describes.\n- Never reply to AI-generated review comments (bot users such as\n  `chatgpt-codex-connector[bot]`, `github-code-quality[bot]`,\n  `github-actions[bot]`, `copilot[bot]`); make approved local fixes silently.\n\n## AI Capability Sources\n\nEditable workflows and domain skills live in `.claude/commands/` and\n`.claude/skills/`. Generated Codex and Muse adapters live in\n`.agents/skills/`; do not hand-edit them. Treat\nonly paths listed by `.agents/skills/.dart-generated.json`, plus the\nmanifest itself, as DART-generated output: preserve unrelated skills in the\nshared `.agents/skills/` directory, and let sync remove only\nmanifest-owned paths.\n\n```bash\npixi run sync-ai-commands\npixi run check-ai-commands\npixi run python scripts/setup_ai.py\npixi run python scripts/check_ai_infrastructure.py --doctor\n```\n\nUnder Muse's default shell sandbox, `.git/` and `.agents/` stay\nread-only, so run Git mutations (switch, commit, merge) and\n`sync-ai-commands` from an unsandboxed shell there (see\n`docs/onboarding/ai-tools.md`).\n\nUse `$dart-ultrawork` in Codex or `/dart-ultrawork` in Claude and Muse\nCode for large, multi-session, or explicitly autonomous work. Its\nproject home is `docs/dev_tasks/<task>/`.\n\n## Before Every Commit\n\n- Run `pixi run lint`, even for docs-only changes.\n- Run `pixi run build` and focused tests when C++ or Python behavior changes;\n  GUI changes also run `pixi run test-gui`.\n- Use `dart-changelog` to decide whether `CHANGELOG.md` needs an entry.\n- Promote durable facts and remove a completing `docs/dev_tasks/<task>/` folder.\n- Run `pixi run install-hooks` once per clone. Its fast staged safety check is\n  not a substitute for the full lint requirement. When it blocks a commit, fix\n  the reported failure; `DART_SKIP_HOOKS=1` is a maintainer emergency bypass\n  to use only when a maintainer explicitly asks.\n", "docs/plans/AGENTS.md": "# docs/plans/\n\nAgent rules for DART living plan documents.\n\n## Purpose\n\n`docs/plans/` connects the branch's north star to executable roadmap choices.\nThese files are living planning docs, not archival status dumps and not\nimplementation trackers.\n\n## Rules\n\n- Start with `docs/ai/north-star.md`, then `docs/plans/README.md`.\n- Keep plans concise and evidence-based; link deeper design rationale to\n  `docs/design/` and active implementation detail to `docs/dev_tasks/`.\n- Keep `dashboard.md` as the single source of truth for priority, status,\n  horizon, dimension, next step, and gate of operating plans.\n- Prefer linking existing active dev-task owners over duplicating their packet\n  boards in on store, not here.** A permission is a fact about\n(user, resource), so two workbenches open on the same project can never disagree about whether\nit is editable. Two consequences: a domain workbench calls `refreshPermission` (not\n`loadPermission`) on mount, because the shared entry would otherwise be as old as whenever some\nother workbench last fetched it — the `refreshing` / `refreshError` fields keep the stale\npermission readable meanwhile, so nothing flashes to read-only; and the session clears the cache\non logout, because it outlives every workbench and would otherwise hand one user's access to\nthe next.\n\n**The dock's state views know nothing about access.** `WorkbenchPanelLoading` and\n`WorkbenchPanelError` (`components/panel/`) are the shared look of \"this panel has no body to\nshow yet\" and \"this panel failed\" — no hooks, no store reads, no notion of permission. They\nwere once called `WorkbenchAccess*`, which made a generic view look like part of an\nauthorization feature it has never been able to see. A caller supplies the vocabulary\n(`label=\"Loading resource access\"`) and the dock supplies the pixels.\n\nNeither takes a `className`; placement is not the caller's. Sixteen sites used to hand-write\n`size-full` or `absolute inset-0 bg-background/80`, and the two scrim opacities had already\ndrifted apart. Don't add the escape hatch back — a caller needing different placement wraps.\n\n**Neither has an overlay form, and neither should grow one.** Both are drawn *instead of* a\nbody that cannot be shown — the first load, before there is anything to render. A **background**\nrefresh must never take over a panel that still works, in either direction:\n\n- Every domain workbench calls `refreshPermission` on mount, so a full-panel scrim would cover\n  every panel on every mount — hiding the stale-but-usable content that `refreshing` exists to\n  preserve, which is the exact flash it was added to prevent.\n- A refresh that *fails* says nothing about access; it says the network hiccuped. Revoked\n  access comes back as a **successful** fetch with a lower role. So blocking a working panel\n  behind a scrim and a Retry button trades a functioning UI for no information — and backend\n  authorization stays authoritative regardless, so it buys no safety either.\n\nWhen a background refresh does need to be visible, spin the control, not the panel — see\n`isRefreshing` on `GitBranchControl`, which is what `access.refreshing` is for.\n\n`access.refreshError` consequently has no consumer. Leave it computed, or surface it in a\ncontrol; do not reintroduce a panel-level scrim for it.\n\n**`config` optionality is a claim.** `props.config` is backed by `record.config ?? {}`, so a"}, "rule_2": {"path": "libs/ui/AGENTS.md", "start_line": 164, "end_line": 164, "heading": "AGENTS.md - @semoss/ui Component Library > Authoring Pattern", "text": "- `className` is always the **last** argument to `cn(...)` so callers can override.", "section_first_line": 132, "section_last_line": 167, "section_text": "## Authoring Pattern\n\nEvery component in `src/next/` follows the same conventions — match them exactly when adding\nor editing components:\n\n```typescript\nimport { cn } from \"@/lib/utils\";               // internal alias, lib-only\nimport { cva, type VariantProps } from \"class-variance-authority\";\n\nconst buttonVariants = cva(\n    \"inline-flex items-center justify-center gap-2 rounded-md text-sm font-medium ...\",\n    {\n        variants: {\n            variant: {\n                default: \"bg-primary text-primary-foreground hover:bg-primary/90\",\n                destructive: \"bg-destructive ...\",\n                outline: \"border bg-background hover:bg-accent ...\",\n                // secondary | ghost | link\n            },\n            size: { default: \"h-9 px-4 py-2\", sm: \"...\", lg: \"...\", icon: \"size-9\" },\n        },\n        defaultVariants: { variant: \"default\", size: \"default\" },\n    },\n);\n```\n\n- **CVA** for variants; variant names stay consistent across components\n  (`default | destructive | outline | secondary | ghost | link`; sizes `default | sm | lg | icon`).\n- **`data-slot=\"<name>\"`** attribute on every root and sub-part (used as styling hooks, e.g.\n  `has-data-[slot=card-action]:grid-cols-[1fr_auto]`).\n- Apply [DESIGN.md](../../DESIGN.md) for token and styling rules.\n- `asChild?: boolean` + Radix `Slot` for polymorphic components.\n- `className` is always the **last** argument to `cn(...)` so callers can override.\n- Export public components together with their `xVariants`, following the React skill's\n  [export policy](../../skills/react-standard.skill.md#architecture-and-exports).\n- Colocate related sub-components in the same file."}, "scope_statements": [{"path": "AGENTS.md", "line": 1, "text": "# AGENTS.md - SEMOSS Monorepo"}, {"path": "AGENTS.md", "line": 30, "text": "Read the owning package's `AGENTS.md` and use the [skill index](./skills/README.md)"}, {"path": "AGENTS.md", "line": 81, "text": "[libs/panels/AGENTS.md](./libs/panels/AGENTS.md#what-a-host-has-to-wire-up)."}, {"path": "AGENTS.md", "line": 85, "text": "[libs/connectors/AGENTS.md](./libs/connectors/AGENTS.md#what-a-host-has-to-wire-up)."}, {"path": "AGENTS.md", "line": 140, "text": "See [DESIGN.md](./DESIGN.md) and the [UI component catalog](./libs/ui/AGENTS.md)."}, {"path": "AGENTS.md", "line": 159, "text": "for imports within a package. See [the utility guide](./libs/utility/AGENTS.md)."}, {"path": "AGENTS.md", "line": 160, "text": "- Search individual files, nested functions, callbacks, and repeated expressions as"}, {"path": "AGENTS.md", "line": 174, "text": "- **`*.local`** files - Local environment overrides (gitignored)"}, {"path": "AGENTS.md", "line": 185, "text": "## Nested AGENTS.md Files"}, {"path": "AGENTS.md", "line": 188, "text": "- [libs/utility/AGENTS.md](./libs/utility/AGENTS.md) - Generic utility ownership and public categories"}, {"path": "AGENTS.md", "line": 189, "text": "- [libs/sdk/AGENTS.md](./libs/sdk/AGENTS.md) - Core SDK specifics"}, {"path": "AGENTS.md", "line": 190, "text": "- [libs/ui/AGENTS.md](./libs/ui/AGENTS.md) - Component library specifics"}, {"path": "AGENTS.md", "line": 191, "text": "- [libs/shared/AGENTS.md](./libs/shared/AGENTS.md) - Shared utilities/components specifics"}, {"path": "AGENTS.md", "line": 192, "text": "- [libs/connectors/AGENTS.md](./libs/connectors/AGENTS.md) - Microsoft 365 and Google Workspace viewers"}, {"path": "AGENTS.md", "line": 193, "text": "- [libs/renderer/AGENTS.md](./libs/renderer/AGENTS.md) - Visualization components specifics"}], "full_files": {"libs/ui/AGENTS.md": "# AGENTS.md - @semoss/ui Component Library\n\nThis document provides context for AI coding assistants working with the SEMOSS UI component library.\n\n> **Inherits from:** [root AGENTS.md](../../AGENTS.md). Load the applicable\n> [root skills](../../skills/README.md), including the [React standard](../../skills/react-standard.skill.md)\n> for implementation and the accessibility/form/mobile skills for relevant UI work.\n> Repo-wide design rules live in [../../DESIGN.md](../../DESIGN.md).\n\n## Overview\n\n`@semoss/ui` is the **single source of truth for design** in this monorepo:\n\n- **shadcn/ui** + **Radix UI** primitives, styled with **Tailwind CSS v4** (CSS-first — there\n  is no `tailwind.config.*` anywhere in the repo).\n- All design tokens live in [src/styles/globals.css](src/styles/globals.css) and are consumed\n  by every app via `@import \"@semoss/ui/globals.css\";`.\n- All shared components live in [src/next/](src/next/) and are imported by consumers **only**\n  as `@semoss/ui/next`.\n\n> **Conventions:** `@semoss/ui` is the **exception** to the root \"one component per file\" rule\n> — related components are colocated in a file (e.g. `Card` + `CardHeader` + `CardContent`).\n\n## Design Tokens (`src/styles/globals.css`)\n\nTokens are raw values on `:root` (light) and `.dark` (dark), mapped to Tailwind utilities via\n`@theme inline`. Token consumption and definition exceptions follow\n[DESIGN.md](../../DESIGN.md#carve-outs-enumerated--nothing-else-is-exempt).\n\n### Semantic colors\n\n| Token | Utility examples | Use for |\n|-------|------------------|---------|\n| `background` / `foreground` | `bg-background`, `text-foreground` | Page surface and default text |\n| `card` / `card-foreground` | `bg-card`, `text-card-foreground` | Card surfaces |\n| `popover` / `popover-foreground` | `bg-popover` | Popovers, dropdowns, menus |\n| `primary` / `primary-foreground` | `bg-primary`, `text-primary` | Brand blue; primary actions, links |\n| `assistant` / `assistant-foreground` | `Button variant=\"assistant\"` | Purple assistant actions, such as Ask Assistant |\n| `muted` / `muted-foreground` | `bg-muted`, `text-muted-foreground` | De-emphasized text/surfaces |\n| `accent` / `accent-foreground` | `hover:bg-accent` | Hover/active tints |\n| `destructive` / `destructive-foreground` | `text-destructive`, `bg-destructive/10` | Errors, dangerous actions |\n| `success` / `success-foreground` | `text-success`, `bg-success/10` | Success/positive status |\n| `warning` / `warning-foreground` | `text-warning`, `bg-warning/10` | Warning/caution status |\n| `border` / `input` / `ring` / `ring-offset` | `border-border`, `ring-ring/50` | Borders, input outlines, focus rings |\n| `chart-1` … `chart-5` | `bg-chart-1`, `text-chart-2` | Data visualization series colors |\n| `sidebar-*` | `bg-sidebar`, `border-sidebar-border` | Sidebar chrome (8 tokens) |\n| `login-*` | — | Login page skin only |\n\nStatus colors are **only** `destructive`, `success`, and `warning`. There is no `info` token —\npropose one before inventing blue status styling.\n\n### Other tokens\n\n- **Radius**: `--radius: 0.625rem`, exposed as `rounded-sm/md/lg/xl`.\n- **Fonts**: `--font-sans` (Geist), `--font-mono` (Geist Mono) → `font-sans`, `font-mono`.\n- **Type scale**: the full Tailwind scale (`--text-xs` … `--text-9xl`, weights, tracking,\n  leading) is re-declared as runtime CSS variables so it can be read at runtime.\n- **Heading/section utilities**: `.heading-xl/lg/md/sm`, `.container-padding-x`,\n  `.section-padding-y`, `.section-title-gap-*` — responsive classes defined in `@layer base`.\n- **Spacing**: no custom scale; use Tailwind defaults on an 8px rhythm (`gap-2`, `p-4`).\n\n### `src/next/theme.ts` is dead code — never use it\n\n`src/next/theme.ts` exports a MUI-shaped `lightTheme`/`darkTheme` palette whose values\ncontradict `globals.css`. It has zero consumers. Never import, extend, or treat it as a token\nsource. Deleting it is planned future work.\n\n## Component Inventory (`src/next/`, imported as `@semoss/ui/next`)\n\n- **Buttons & actions**: `Button` (+`buttonVariants`), `ButtonGroup`, `Toggle`, `ToggleGroup`\n- **Inputs & forms**: `Input`, `Textarea`, `Checkbox`, `RadioGroup`, `Select`, `Slider`,\n  `Switch`, `Label`, `Calendar`, `FileDropzone`, `InputGroup`, `Field` (+ `FieldLabel`,\n  `FieldError`, …)\n- **Layout**: `Card`, `Separator`, `ScrollArea`, `Resizable*`, `Collapsible`, `Item`,\n  `Sidebar` (+ `SidebarProvider`, `useSidebar`, …)\n- **Typography**: `H1`, `H2`, `H3`, `H4`, `Lead`, `P`, `Large`, `Small`, `Muted`,\n  `InlineCode`, `MultilineCode`, `List`, `Quote`\n- **Feedback**: `Alert`, `toast` + `Toaster` (sonner), `Progress`, `Skeleton`, `Spinner`,\n  `LoadingScreen`\n- **Overlays**: `Dialog`, `Sheet`, `Drawer`, `Popover`, `HoverCard`, `Tooltip`,\n  `DropdownMenu`, `ContextMenu`, `Command`\n- **Data display**: `Table`, `TreeView`, `Badge` (+`badgeVariants`), `Avatar`, `Accordion`,\n  `Code`, `Markdown`\n- **Navigation**: `Breadcrumb`, `Pagination`, `Tabs`, `Stepper`\n- **Theming**: `ThemeProvider`, `useTheme` (`\"dark\" | \"light\" | \"system\"`)\n- **Utilities & hooks**: `cn`, `useCacheState`, `useDebouncedCallback`, `useDebouncedValue`,\n  `useInfiniteScroll`, `useIsMobile`\n\n`Progress` reports its value as the bar's `aria-valuenow`, kept between 0 and `max` (100 by\ndefault); with no value it is indeterminate. Give it an `aria-label`, and an `aria-valuetext`\nwhen a bare percentage does not say what it measures.\n\n### Typography map\n\nThere is **no** `<Typography variant=\"...\">` component. Use the discrete components:\n\n| Component | Element | Use for |\n|-----------|---------|---------|\n| `H1`–`H4` | `h1`–`h4` | Headings (bold/semibold, 4xl→xl) |\n| `Lead` | `p` | Intro/subtitle text (muted, xl) |\n| `P` | `p` | Body text |\n| `Large` / `Small` | `div` / `p` | Emphasized / fine-print text |\n| `Muted` | `span` | Secondary/hint text |\n| `InlineCode` / `MultilineCode` | `code` / `pre` | Code snippets |\n| `List` / `Quote` | `ul` / `blockquote` | Lists / block quotes |\n\n### Import rules for consumers\n\n```typescript\n// The only sanctioned import path — components, hooks, and cn():\nimport { Button, H2, Muted, cn, toast } from \"@semoss/ui/next\";\n```\n\n```css\n/* Once per app, at the top of its index.css: */\n@import \"@semoss/ui/globals.css\";\n```\n\n- The bare `@semoss/ui` barrel currently re-exports `./next`; the supported design-system\n  convention for consumers is `@semoss/ui/next`.\n- The `@/*` alias (e.g. `@/lib/utils`) is **internal to this lib** — consumers must never\n  use it.\n\n## shadcn/ui Configuration\n\nFrom `components.json`:\n- **Style**: new-york\n- **Base color**: zinc\n- **CSS variables**: enabled\n- **Icon library**: lucide-react\n\n## Authoring Pattern\n\nEvery component in `src/next/` follows the same conventions — match them exactly when adding\nor editing components:\n\n```typescript\nimport { cn } from \"@/lib/utils\";               // internal alias, lib-only\nimport { cva, type VariantProps } from \"class-variance-authority\";\n\nconst buttonVariants = cva(\n    \"inline-flex items-center justify-center gap-2 rounded-md text-sm font-medium ...\",\n    {\n        variants: {\n            variant: {\n                default: \"bg-primary text-primary-foreground hover:bg-primary/90\",\n                destructive: \"bg-destructive ...\",\n                outline: \"border bg-background hover:bg-accent ...\",\n                // secondary | ghost | link\n            },\n            size: { default: \"h-9 px-4 py-2\", sm: \"...\", lg: \"...\", icon: \"size-9\" },\n        },\n        defaultVariants: { variant: \"default\", size: \"default\" },\n    },\n);\n```\n\n- **CVA** for variants; variant names stay consistent across components\n  (`default | destructive | outline | secondary | ghost | link`; sizes `default | sm | lg | icon`).\n- **`data-slot=\"<name>\"`** attribute on every root and sub-part (used as styling hooks, e.g.\n  `has-data-[slot=card-action]:grid-cols-[1fr_auto]`).\n- Apply [DESIGN.md](../../DESIGN.md) for token and styling rules.\n- `asChild?: boolean` + Radix `Slot` for polymorphic components.\n- `className` is always the **last** argument to `cn(...)` so callers can override.\n- Export public components together with their `xVariants`, following the React skill's\n  [export policy](../../skills/react-standard.skill.md#architecture-and-exports).\n- Colocate related sub-components in the same file.\n\n### The `cn()` Utility\n\n```typescript\n// Combines clsx + tailwind-merge — use for ALL className composition\n<div className={cn(\"base-class\", conditional && \"conditional-class\", className)} />\n```\n\n**Location**: `src/lib/utils.ts` (internal import `@/lib/utils`); re-exported to consumers\nthrough `@semoss/ui/next`.\n\n## Structure\n\n```\nsrc/\n├── next/            # All components (shadcn/Radix style, flat kebab-case files)\n│   └── index.ts     # Public component entry point\n├── hooks/           # Shared React hooks\n├── lib/             # Utilities (cn, etc.)\n├── styles/          # globals.css — the design-token source of truth\n└── index.ts         # Re-exports ./next\n```\n\n## Build System\n\n- **Bundler**: Vite 8 library build\n- **Output**: ES modules (`dist/index.mjs`, `dist/next.mjs`)\n- **Types**: TypeScript declarations (`dist/types/`)\n- **Styles**: `@semoss/ui/globals.css` exports `src/styles/globals.css` directly;\n  consumers process it with their Tailwind setup.\n\n### Commands\n\n| Command | Description |\n|---------|-------------|\n| `pnpm dev` | Watch mode with Vite (`vite build --watch`) |\n| `pnpm build` | Production build |\n| `pnpm build:dev` | Development build |\n\nRun these commands from `libs/ui`, or use `pnpm --filter @semoss/ui <command>` from the root.\n\n## Key Dependencies\n\n- **Radix UI**: Accessible primitives (dialog, dropdown, select, etc.)\n- **class-variance-authority**: Component variants\n- **lucide-react**: Icon library\n- **tailwind-merge** + **clsx**: `cn()` class merging\n- **`@shikijs/*`**: Code syntax highlighting\n- **Peer dependencies**: React and React DOM `^18.3.1 || ^19.0.0`, plus\n  `react-hook-form`, `@hookform/resolvers`, and `zod`. Keep consumers compatible with\n  the ranges in `package.json`.\n\n## Agent Guardrails\n\n### Do Not Modify\n\n- **`dist/`** - Build output, regenerated on build\n- **Peer dependency versions** - Must stay synchronized with consuming packages\n\n### Be Cautious With\n\n- **`src/next/index.ts` / `src/index.ts`** - Main exports, affect all consumers\n- **`src/styles/globals.css`** - Token changes affect every app; adding a token requires\n  light + dark values and an `@theme inline` mapping\n- **`vite.config.ts`** - Build configuration\n- **`components.json`** - shadcn CLI configuration\n\n### When Adding Components\n\n1. Add the component to `src/next/` (flat kebab-case file)\n2. Follow the authoring pattern above (CVA + `data-slot` + Radix + tokens)\n3. Add the export to `src/next/index.ts`\n4. Use `cn()` for all className composition\n5. Reuse existing variant/size names before inventing new ones\n\n### Testing Components\n\n```bash\npnpm --filter @semoss/ui build\n```\n\nThen test in a consuming package:\n```bash\npnpm --filter @semoss/playground dev\n```\n", "libs/workbench/AGENTS.md": "# AGENTS.md - @semoss/workbench\n\nThe multi-panel dock shell: core, store, context, hooks. Nothing here may know about SEMOSS,\nengines, projects, pixels, or auth.\n\n> **Inherits from:** [../../AGENTS.md](../../AGENTS.md) (root).\n> Load the applicable [root skills](../../skills/README.md), including the\n> [React standard](../../skills/react-standard.skill.md), for general implementation rules.\n\n## What it is\n\nA multi-panel dock shell (no FlexLayout). The core knows about a `WorkbenchProvider` and nothing\nelse about who is using it: a host supplies the panel blueprints and a snapshot to open with, and\ngets a dock back. It has no id of its own — a host that wants a fresh dock gives the provider a\nReact `key`, and anything that needs to be *named* (a cache entry, a server-side record) is named\nby the host. **The dock stores nothing** — a host hands it a\nlayout and takes snapshots back, so where an arrangement lives is the host's decision. `packages/client` is the first consumer — one\n`<Domain>Workbench` component and one isolated store instance per engine and project type —\nand the playground and terminal are the reason this is a package rather than a folder.\n\nThe model: **blueprints and instances**. A `WorkbenchPanelConfig` (blueprint) describes a\npanel *type* — icon, content, capabilities, mount policy. A `WorkbenchPanelRecord` (instance)\nis one open panel — a unique id pointing at a type, with its own name and `config`. The layout\nis a tree of tabsets plus four collapsible borders; panel bodies render in a flat layer over\nmeasured slots, so moving a tab never unmounts its body.\n\n**The invariant, and the whole reason this package exists:** no import of `@semoss/sdk`,\n`@semoss/shared`, `@semoss/i18n`, or anything host-shaped. The only runtime dependencies are\n`react`, `react-dom`, `@semoss/ui` (consumed through `@semoss/ui/next`), `lucide-react`,\nand the `zustand` peer. The host supplies a compatible Zustand version and owns store\ninstances; declaring a peer does not itself prevent duplicate stores. Verify boundaries with:\n\n```sh\n# From libs/workbench; inspect matches, including multiline imports and aliases\nrg -n '@semoss/(sdk|shared|i18n)|@/' src --glob '*.{ts,tsx}'\n```\n\nTwo things that used to live here and deliberately do not any more: the **assistant**, which is\nan agent harness and owns its own store in the host, and **resource permissions**, which are a\nfact about (user, resource) and belong to the host's session. `WorkbenchState` is exactly\n`{ layout, loading, command, control, events }`.\n\n## Layout\n\nStandard library layout per the [root conventions](../../AGENTS.md#package-structure-conventions):\n\n```\nsrc/\n├── components/        the dock, split by seam (one component per file, kebab-case)\n│   ├── shell/         the root, and the two invisible layers it mounts over everything\n│   ├── dock/          the arrangement surfaces: stage, tabsets, tabs, strip, resizer, borders\n│   ├── panel/         one panel's body pipeline, and its own loading/error states\n│   ├── mobile/        the no-rails shell and its drawer\n│   ├── command/       the palette and its navbar trigger\n│   ├── menu/          the generic View dropdown and per-panel right-click menu\n│   └── chrome/        reusable chrome controls the shell or a host places\n├── constants/         workbench.constants.ts — WORKBENCH_STYLES\n├── contexts/          workbench.context.tsx\n├── hooks/             use-<name>.ts\n├── stores/            workbench.store.ts + slices/\n├── utility/           React-free helpers (drop geometry, slot resolution, the spawn-drag protocol)\n├── types.ts           every shared type — one file, don't start a second\n└── index.ts           the curated public surface\n```\n\nFollow the [React import/export policy](../../skills/react-standard.skill.md#architecture-and-exports).\nLegacy barrels in `hooks/`, `stores/`, and `stores/slices/` remain compatibility structure\nfor untouched consumers.\n\n**No barrel uses `export *`.** `src/index.ts` names the file that defines each symbol and does\nnot hop through an internal barrel. Two wildcards used to sit there, and they leaked 28 symbols\npast the \"add it when a consumer needs it\" rule without anyone deciding to. Adding a symbol to\nthat file is a deliberate act; a type with no consumer does not belong in it, and a host that\nneeds a missing shape should try deriving it first (`ComponentProps<typeof Workbench>`, or\nindexed access like `NonNullable<WorkbenchPanelConfig[\"menuItems\"]>`).\n\nType imports come from `../../types`, constants from `../../constants/workbench.constants`.\nNew or touched store and hook imports likewise name their defining files, such as\n`../../stores/workbench.store` and `../../hooks/use-workbench`.\n\nThe folder graph is acyclic and must stay that way: `shell → {dock, panel, command, mobile}`,\n`dock → {panel, menu}`, `mobile → dock`, and `chrome`/`menu`/`command`/`panel` point at nothing\nin `components/` above them.\n\n## One context, one hook, one namespace per domain\n\nEverything reaches the per-mount store through `useWorkbench(selector)`. State is grouped by\ndomain — `layout`, `loading`, `command`, `control`, `events` — and each namespace carries its own\nfields and its own `actions`:\n\n```ts\nconst actions = useWorkbench((s) => s.layout.actions); // stable object — never re-renders\nconst panel = useWorkbench((s) => s.layout.panels[pid]); // narrow state reads\nconst open = useWorkbench((s) => s.command.isCommandOpen);\n```\n\nSelect from the namespace that owns the action — `s.command.actions.registerCommand`,\n`s.loading.actions.setLoading` — rather than expecting one merged object.\n\n**A host's own stores are its own.** The client's assistant, database, and model stores each\ntake this store as an injected dependency (`{ workbench: StoreApi<WorkbenchState> }`) and are\nprovided beside it. The arrow only ever points host -> dock: nothing in this package may\nimport or assume any of them.\n\n`useWorkbenchStoreApi()` returns the raw `StoreApi` (same context). Reach for it only in the\nthree cases that a selector genuinely cannot serve, and that are the only ones left in the tree:\n\n- a vanilla `subscribe` that must not re-render (`hooks/use-workbench-life-cycle.ts`)\n- wiring one store into another (a domain workbench wiring one store into another)\n- reading live state per animation frame (`components/shell/workbench-drag-layer.tsx`'s hit-test)\n\nNeeding a *fresh* read inside an imperative handler is not one of them — that belongs on a query\naction beside `canClose` / `findPanels` / `getPanel`, where it closes over the slice's own `get()`\nand costs no subscription.\n\n**Adding a slice.** Type it `WorkbenchSlice<TState>`. `set`/`get` are the whole store's, so a\nslice owns its namespace explicitly — `get().layout.hydrated`, and every write nests:\n\n```ts\nset((root) => ({ layout: { ...root.layout, tree } }));\n```\n\nMiss the spread and you drop the rest of the namespace, so route bulk writes through one commit\nhelper the way the layout slice does. Reaching across namespaces is just another read off\n`get()`; the third argument is the root `StoreApi`, for `api.subscribe`.\n\n## Adding a panel (3 steps)\n\n1. Add its id to `WORKBENCH_COMPONENTS` (the host's panel-type constant). Never use\n   a raw string literal as a panel type.\n2. Co-export a module-scope blueprint const from the panel file\n  (`export const MY_PANEL: WorkbenchPanelConfig<MyPanelConfig> = { name, icon, content, … }`) —\n  see the client's `ASSISTANT_PANEL`. Module scope matters:\n   blueprint identity churn remounts panels.\n3. Reference it in a domain workbench's module-scope `COMPONENTS` map; if it should be open by\n   default, add a `WorkbenchPanelRecord` to the layout literal (the client keeps its shared\n   singletons in `WORKBENCH_PANEL_RECORDS`).\n\n**Typing a panel.** Every renderer — `content`, `header`, `icon`, and a control — is handed\n`WorkbenchPanelProps`, which is **one prop: `id`** (`icon` also gets the `className` its caller\nhas room for). Everything else comes from `useWorkbenchPanel<P, V>(id)`, where `P` is the shape\nof the `config` its instances are opened with and `V` its scratch value:\n\n```tsx\nexport interface MyPanelConfig { path: string }\n\nexport const MyPanel = ({ id }: WorkbenchPanelProps) => {\n\tconst { config, rename } = useWorkbenchPanel<MyPanelConfig>(id);\n\t…\n};\n\nexport const MY_PANEL: WorkbenchPanelConfig<MyPanelConfig> = {\n\tmatches: (a, b) => a.path === b.path,   // a.path is `string`, not `unknown`\n\ticon: MyPanelIcon,                      // ({ id, className }) — reads its own panel\n\tcontent: MyPanel,\n};\n```\n\n`WorkbenchPanelConfig<P, V>` stays generic for `matches`, `commands` and `menuItems`; the\nrenderer slots are not, because a renderer names `P`/`V` itself at its `useWorkbenchPanel`\ncall. Declare them the same way the blueprint does — nothing checks that the two agree.\n\n**There is no chrome contract.** A body, a header, an icon and a control all read the same\n`WorkbenchPanel<P, V>`: `id`, `type`, `name`, `config`, `value`, `isVisible`, `status`, plus\n`rename`, `close`, `moveTo`, `setConfig`, `setValue`, `select`. Wrapping another panel is\npassing the id on: `<Other id={id} />`. `useWorkbenchPanel(pid)`\n(`hooks/use-workbench-panel.ts`) is the only place one is assembled — there is no second,\nReact-free builder, and nothing outside that file should grow one.\n\n`WorkbenchHeaderLocation` (\"tab\" | \"header\" | \"rail\" | \"rail-vertical\") is deliberately *not*\non it. The same panel is drawn in two of them at once — a border's rail and the header row over\nits body — so it is a fact about a render site, not about a panel, and it cannot live in the\nstore. It is internal to the shell's chrome. A blueprint that genuinely needs to draw itself\ndifferently on a vertical rail gets it from a context the chrome publishes; don't add it back\nas a renderer prop, which is the thing this API removed.\n\n**What is identity-stable** (`hooks/use-workbench-panel.test.tsx` pins all of it): the methods\nare built once per `pid` — the store's actions are created once — so `setValue` and friends are\nsafe effect dependencies; `config` and `value` are the store's own objects and change only when\nwritten (a panel with no config gets one shared `EMPTY_CONFIG`, not a fresh `{}`); and the\nreturned object itself changes when any field does, which is what re-renders the renderer.\nDestructure it — never put the whole object in a dependency array.\n\n**Panel type is not panel id.** `type` selects a blueprint; `id` identifies one instance of\nthat blueprint. Static layouts may deliberately seed a singleton whose `id` equals its `type`,\nbut that is a local layout convenience, not a workbench invariant. JSON-defined layouts and\nruntime `spawnPanel` calls may assign arbitrary instance ids, and several instances may share\none type.\n\n- A panel or control uses the `id` supplied in its props to read or update its own scratch\n  `value`; never index `layout.values` by `type` or by a `WORKBENCH_COMPONENTS` value.\n- Shared hooks and components locate another panel with `getPanel` / `findPanels` and its\n  record/config, or use `selectPanel(type, config)` when reveal-or-create is the intent. They\n  must not assume a well-known instance id.\n- An owning domain workbench may access `layout.values[STATIC_PANEL_ID]` only when its own\n  static layout literal/factory seeds that exact instance id. Keep that assumption local to\n  the workbench. Do not copy it into panels, hooks, stores, or reusable helpers.\n- When layouts become data-driven, commands must resolve the target instance from the loaded\n  records/config instead of relying on the static-layout exception.\n\n**Authorization is runtime state, never layout config.** Resource panels call\n`useAccess(type, id)` directly in their body — it returns a discriminated union\n(`\"loading\"` / `\"error\"` / `\"ready\"`), narrowing to `permission`/`readOnly` only once resolved.\nDo not serialize `permission` or `readOnly` into a panel record, DB layout, or localStorage\nsnapshot. Backend authorization remains authoritative.\n\n**The permission cache lives on the session store, not here.** A permission is a fact about\n(user, resource), so two workbenches open on the same project can never disagree about whether\nit is editable. Two consequences: a domain workbench calls `refreshPermission` (not\n`loadPermission`) on mount, because the shared entry would otherwise be as old as whenever some\nother workbench last fetched it — the `refreshing` / `refreshError` fields keep the stale\npermission readable meanwhile, so nothing flashes to read-only; and the session clears the cache\non logout, because it outlives every workbench and would otherwise hand one user's access to\nthe next.\n\n**The dock's state views know nothing about access.** `WorkbenchPanelLoading` and\n`WorkbenchPanelError` (`components/panel/`) are the shared look of \"this panel has no body to\nshow yet\" and \"this panel failed\" — no hooks, no store reads, no notion of permission. They\nwere once called `WorkbenchAccess*`, which made a generic view look like part of an\nauthorization feature it has never been able to see. A caller supplies the vocabulary\n(`label=\"Loading resource access\"`) and the dock supplies the pixels.\n\nNeither takes a `className`; placement is not the caller's. Sixteen sites used to hand-write\n`size-full` or `absolute inset-0 bg-background/80`, and the two scrim opacities had already\ndrifted apart. Don't add the escape hatch back — a caller needing different placement wraps.\n\n**Neither has an overlay form, and neither should grow one.** Both are drawn *instead of* a\nbody that cannot be shown — the first load, before there is anything to render. A **background**\nrefresh must never take over a panel that still works, in either direction:\n\n- Every domain workbench calls `refreshPermission` on mount, so a full-panel scrim would cover\n  every panel on every mount — hiding the stale-but-usable content that `refreshing` exists to\n  preserve, which is the exact flash it was added to prevent.\n- A refresh that *fails* says nothing about access; it says the network hiccuped. Revoked\n  access comes back as a **successful** fetch with a lower role. So blocking a working panel\n  behind a scrim and a Retry button trades a functioning UI for no information — and backend\n  authorization stays authoritative regardless, so it buys no safety either.\n\nWhen a background refresh does need to be visible, spin the control, not the panel — see\n`isRefreshing` on `GitBranchControl`, which is what `access.refreshing` is for.\n\n`access.refreshError` consequently has no consumer. Leave it computed, or surface it in a\ncontrol; do not reintroduce a panel-level scrim for it.\n\n**`config` optionality is a claim.** `props.config` is backed by `record.config ?? {}`, so a\nrequired field that no seeding site actually sets is `undefined` at runtime despite its type.\nMark a field optional unless every `selectPanel`/layout-literal that opens the panel sets it.\n\n**`commands` / `menuItems` run outside React** — no hooks. They receive `(panel, get)` and\nreach generic workbench state through `get`. When a command needs domain or React state,\nregister it from inside the body with `useWorkbenchCommands` instead.\n\n**Mount policy — read this twice.** The default is `\"lazy\"`: a hidden panel UNMOUNTS. Any\npanel with user-visible local state (unsaved editor buffer, terminal session, chat scroll,\nsearch text, an iframe) MUST declare `mount: \"keepAlive\"`. Audit question: *\"does it useState\nanything a user would miss after a tab switch?\"* If yes → keepAlive. `\"eager\"` additionally\nmounts before first show (the assistant uses it to initialize while its border is collapsed).\n\n## Adding a domain workbench\n\nOne file: module-scope `LAYOUT: WorkbenchLayout` + `COMPONENTS` map + a\n`useWorkbenchCommands([...])` call + `<Workbench snapshot onUnmount borderSlots />`. Toolbar\ncontrols (command menu, publish, settings toggle) go in `borderSlots.left.after` — there is no\nseparate `actions` prop. The page wraps it in `<WorkbenchProvider components={COMPONENTS}>`, and\nthe shell caches its own arrangement with `useCacheState` under a name it builds from what it is\nopen on — include runtime variants such as read-only mode in that name, or the two arrangements\ncollide. Follow `engine/function/function-workbench.tsx` as the exemplar.\n\n**Blueprints are construction data, not registration.** The store reads them from its first call\n— `matchPanels` takes each type's identity rule from the map — so they are passed to\n`createWorkbenchStore`, never pushed in later from an effect. A host whose blueprints are not in\nplace before it opens a panel silently dedupes on a shallow compare of config instead.\n\n**When the dock has to outlive its shell**, the host makes the store itself with\n`createWorkbenchStore({ components })` and passes\n`<WorkbenchProvider store={…}>` instead. Take that branch when panels are opened from outside\nReact, or while `<Workbench>` is unmounted — the playground's room sidebar is both, since a tool\nopens a panel *and* opens the sidebar that shows it. Such a host restores the arrangement itself\nwith `loadSnapshot` when it creates the store.\n\n**Commands**: register palette commands with `useWorkbenchCommands([...])` (`hooks/use-workbench-commands.ts`) from the component that owns them — a domain workbench or a panel.\nThe array may be an inline literal: the hook re-registers only when\nids/categories/labels/descriptions change and executed handlers always run the latest closures,\nso there are no effect dependencies to manage. Unregistration happens on unmount.\n\nCommands carry no icons. Every command sets a `category` from the small fixed set — `View`\n(open/close panels, borders, maximize, reset), `Go to` (panel navigation), `Editor`,\n`Project`, `Database` — and the palette displays it as `Category: Label` (Title Case), sorted\nalphabetically. Don't bake the prefix into `label`.\n\n**Generic menus are opt-in.** Put `<WorkbenchMenus />` in `borderSlots.top.before` for a\nView dropdown with Layout and Navigate submenus, a command-palette entry, and toggles for\noccupied side areas. A host supplies `translate` for localized labels and may supply\n`maximize` for whole-work-area expansion. `textSize=\"xs\"` reduces trigger and menu text while retaining mobile hit targets. `viewItems` inserts a host-owned section, and\n`showNavigation={false}` hides Navigate while retaining its keyboard/palette commands. The dock has no translation or host dependencies.\nLayout presets rearrange movable main-area tabs while preserving panel records, scratch\nvalues, and borders. Navigation includes collapsed border panels.\n\nOn mobile, `left.after`, `top.before`, and `top.after` appear in the actions drawer.\nForward the slot context's `onNavigate` to `WorkbenchMenus` so choosing a panel dismisses\nthe drawer. Desktop-only layout controls are hidden while the desktop arrangement is retained.\n\n**Controls**: a panel contributes at most one chrome control with\n`useWorkbenchControl(id, content)` (`hooks/use-workbench-control.tsx`) from inside its body —\nthere is no blueprint slot for this, precisely so `content` can reach the panel's own refs and\nstate. `content` receives the panel's `id` and owns its label, disabled state, and\nclick handling; the core only places it — in the **header row of the panel's stack**, and only\nfor that stack's **active** tab. A dock's header row is its tab strip (the control lands beside\nthe maximize button); a border has no strip, so the shell draws one over the open body and the\ncontrol sits there. The rail carries navigation only — it is one `chromeButton` wide, which\nfits a glyph and nothing else. There are no effect dependencies to manage: the hook keeps\n`content` in a ref it refreshes every render and registers one stable wrapper, so registration\nchurns only when a control appears or disappears, and a keepAlive panel's registration simply\nwaits, hidden, until its tab is front again.\n\n**A control does not re-render with its panel — read this twice.** It draws inside\n`WorkbenchPanelControls` (`components/panel/workbench-panel-header.tsx`), a separate subtree\nsubscribed only to `s.control.controls[pid]` — and, through its own `useWorkbenchPanel(id)`\ncall, to that panel's store state. Refreshing the ref\nschedules nothing, so a fresh closure sits unread until the *chrome* re-renders for its own\nreasons — a control closed over a panel's `useState` silently never updates.\n\nSo **a control is its own component in its own file** (the repo's one-component-per-file rule),\nnamed `<panel>-<action>-control.tsx` beside the panel, subscribing to whatever live state it\ndraws. Live domain state comes from the domain hook (the chrome sits under the same\n`WorkbenchProvider`); the panel's own state has to travel through the store, which is what the\nnever-persisted scratch `value` is for — the panel gets `value`, the control gets `setValue`:\n\n```tsx\n// database-columns-refresh-control.tsx — live state off the domain store\nexport const DatabaseColumnsRefreshControl: FC<WorkbenchPanelProps> = () => {\n\tconst isLoading = useDatabaseWorkbench((s) => s.structure.status === \"LOADING\");\n\t…\n};\n\n// code-app-renderer-refresh-control.tsx — the panel's own state, via `value`\nexport const CodeAppRendererRefreshControl: FC<WorkbenchPanelProps> = ({ id }) => {\n\tconst { setValue } = useWorkbenchPanel<WorkbenchPanelParams, number>(id);\n\treturn <Button onClick={() => setValue((count = 0) => count + 1)}>…<\/Button>;\n};\n```\n\nA control that needs neither — it drives a domain store only — simply ignores the `id` it is\nhanded. The three live controls — `engine/database/database-columns-refresh-control.tsx`,\n`engine/database/database-new-query-control.tsx`, `project/code/code-app-renderer-refresh-control.tsx`\n— are the exemplars. An inline arrow is a second cost on top of the staleness: it takes a new\nidentity every render, so whenever the chrome *does* re-render, React sees a new element type at\nthe wrapper's child and remounts the control, resetting an open popover or focus inside it.\n\nA blueprint that draws its own heading sets `enableBorderHeader: false` to suppress the shell's\nrow (`components/assistant/assistant-view.tsx` is the one case). That opts out of the control\nslot too — such a panel owns its whole chrome and draws its actions in its own heading. Note\nthe mobile shell renders no controls at all; it has no rails and no per-panel header row.\n\n**Publishing a whole api on `value`.** The four file-explorer panels show the pattern for a\ncontrol that needs to *drive* its panel rather than just show a flag: `useFileExplorer` returns\nan identity-stable api object, so the panel publishes it once —\n`useEffect(() => setValue(explorer), [explorer, setValue])` — and `file-explorer-control.tsx` reads\n`value` and calls `value.commands.*`. Two constraints come with it:\n\n- **The control still does not re-render with its panel.** It sees live *behaviour*, not live\n  *state*, so it must draw only fixed content. That is why `FileExplorerRefreshAction` has no\n  loading spinner: a status-driven glyph in the chrome would freeze mid-animation.\n\n- `selectPanel(type, config?, opts?)` reveals an existing instance matching `config` (blueprint\n  `matches`, shallow-equal default) or spawns a new one. `matches` does **not** imply\n  uniqueness — `spawnPanel` bypasses it — so when several instances match, the one already on\n  screen wins. It returns the selected or created **instance id**. Commands should use it —\n  never target tabset ids (the empty-tabset fallback regenerates them).\n- **`closePanel` deletes the instance.** There is no reopen history: the record and its scratch\n  `value` are dropped, so `layout.panels` always means exactly \"what is open\". Anything that\n  looks a panel up by config depends on that — a lingering record for a closed panel would keep\n  matching forever and get revealed instead of a live one. A cache written before this was true\n  is pruned on load (`applySnapshot`).\n- `spawnPanel(type, opts?)` always creates a new instance; `opts.target` supports\n  `{ kind: \"border\", side }` and `{ kind: \"join\", tabsetId }`.\n- `matchPanels(type, config?)` returns what `selectPanel` *would* reveal, most-preferred first,\n  without revealing anything. It is the one place the identity rule lives, so host code that has\n  to act on \"the panel this config names\" — close it, ask whether it is the front tab — goes\n  through it rather than re-deriving `matches` and drifting.\n- File-style panels dedupe via blueprint `matches` on `config.path` — ids are minted, never\n  encode data in them.\n\n**Dropping something in from outside the dock.** `utility/workbench-spawn-drag.ts` owns a small\nprotocol: a native HTML5 drag that carries `WORKBENCH_SPAWN_DRAG_TYPE` (write it with\n`writeSpawnDragSpec`) asks the shell to open a panel where it lands. `WorkbenchDragLayer` picks\nthese up alongside its pointer-event tab drags, resolves them through the same\n`useWorkbenchHitTest` geometry, and commits with `spawnPanel` followed by `movePanel`.\n\nBoth halves are deliberate. **`spawnPanel`, not `selectPanel`**: a drag is a request for a\n*new* view, so dragging a file that is already open leaves the open instance exactly where it\nis and adds a second one — blueprint `matches` dedupe still applies to `selectPanel`, which is\nwhat clicking the file in the explorer uses. **Then `movePanel`**, because `spawnPanel` honours\nonly `border` and `join` targets itself, so routing every drop through the move is what makes\n`split` and `root` work.\n\nTwo more constraints worth knowing before touching this:\n\n- **The payload is additive.** The same drag still carries the explorer's own move payload, so\n  a row-to-row file move inside the tree is unaffected. Only `dataTransfer.types` is readable\n  during `dragover`, which is why the intent lives in the key and the spec is read on `drop`.\n- **`dropEffect` must be one of the operations the source's `effectAllowed` names.** The\n  explorer's rows allow `copyMove`; the dock asks for `copy` (the file stays put) and a folder\n  row asks for `move`. Ask for something outside `effectAllowed` and the browser resolves the\n  drag to \"none\" — it still paints the drop preview and then silently never fires `drop`.\n\n## File map\n\n| File/folder | Role |\n|---|---|\n| `components/shell/` | `workbench.tsx` (the shell), plus the two invisible layers it mounts over everything: the drag layer and the slot measurer |\n| `components/dock/` | The arrangement surfaces: stage, tabset, tab, tab strip, resizer, and the four borders |\n| `components/panel/` | One panel's body pipeline — the flat layer, its per-panel hosts (never-unmount bodies), the body itself, its header content/controls, the error boundary — plus `WorkbenchPanelLoading` / `WorkbenchPanelError`, the two **public** state views a panel draws in place of its own body |\n| `components/mobile/` | The no-rails phone shell and its bottom drawer |\n| `components/menu/` | The per-panel right-click menu: the Radix trigger, and the menu body keyed on where the panel lives |\n| `components/chrome/` | `WorkbenchChromeButton` (the canonical chrome icon button) and `WorkbenchResetButton`, both public |\n| `components/command/workbench-command-palette.tsx` | Cmd/Ctrl+Shift+P or F1 palette: registered commands + layout-derived entries (built only while open), icon-less `Category: Label` rows in a deterministic alphabetical order |\n| `components/mobile/workbench-mobile-drawer.tsx` / `components/chrome/workbench-reset-button.tsx` | On desktop the reset control rides at the end of the left rail, appended to `borderSlots.left.after`. The mobile layout has no rails, so `WorkbenchMobile` passes that slot to its **drawer** instead: the pager bar's ☰ opens a bottom drawer leading with that slot content + reset as an actions row, then every open panel as one full-width row that switches to it. Reset restores the default layout (hidden when `readOnly`) |\n| `constants/workbench.constants.ts` | `WORKBENCH_STYLES` — the one size scale the chrome draws itself at |\n| `contexts/workbench.context.tsx` | `WorkbenchProvider` — one store per mount |\n| `hooks/` | `use-workbench` / `-store-api` (store access), `-commands`, `-control`, `-panel` (everything about one panel), `-event` (subscribe to the bus), `-life-cycle` (vanilla store→host bridge), `-hit-test` (drop resolution shared by tab drags and spawn drags) |\n| `stores/workbench.store.ts` | Composes the five slices; `WorkbenchState` is exactly `{ layout, loading, command, control, events }` |\n| `stores/slices/workbench-layout.slice.ts` | The dock state + `actions` (registry, slots, persistence, ephemeral UI) |\n| `stores/slices/workbench-layout.tree.ts` | Pure, DOM-free tree ops |\n| `stores/slices/workbench-layout.commands.ts` | Layout-derived palette entries |\n| `stores/slices/workbench-controls.slice.ts` | Panel-contributed chrome controls, keyed by panel id; each control is its own `*-control.tsx` file beside its panel |\n| `stores/slices/workbench-events.slice.ts` | The panel-to-panel bus. Fire-and-forget, nothing retained, subscribers held in the slice closure rather than in state |\n| `utility/workbench-spawn-drag.ts` | The `dataTransfer` protocol for \"dropping me should open a panel\" |\n| `utility/workbench-drop.ts` | The ordered geometric drop resolution |\n| `utility/workbench-border-slot.ts` | `resolveBorderSlot` — a slot is a node or a function of the border's state. Out here because three shells resolve slots, including the mobile drawer, which has no rails |\n| `types.ts` | Every *shared* workbench type: `WorkbenchLayout`, `WorkbenchPanelConfig`, `WorkbenchPanel`, `WorkbenchPanelProps`, `WorkbenchComponent`, `WorkbenchBorderSlot`, `WorkbenchCommand`, `WorkbenchSlice`. One file — don't start a second. This is the package's **internal** contract; `index.ts` re-exports only the slice of it a consumer imports. The shell's own `WorkbenchProps` is *not* here — it is declared unexported in `components/shell/workbench.tsx`, because nothing but the shell needs it |\n| `index.ts` | The public surface — every export names its defining file, and there is no `export *` anywhere. Shell internals (tabset, tab, stage, border, drag layer, panel hosts, resizers, the mobile shell, the context menu, the error boundary) stay private; the `WorkbenchTabset` **component** would also collide with the `WorkbenchTabset` layout-node type. `types.ts` stays the internal contract — only the types a consumer actually imports are re-exported here. Add to it when a consumer needs a symbol, not before |\n\n## Rules\n\n- **Keep it domain-agnostic.** This is the package's reason to exist; see the grep above.\n- **Three channels, three jobs — pick by what you are saying.** An **event**\n  (`events.actions.emit` / `useWorkbenchEvent`) says *\"this just happened\"* to whoever is\n  listening: fire-and-forget, nothing retained, only mounted panels hear it. **`setValue`** says\n  *\"here is my current state, or my api\"* — for a value a late-mounting panel still needs, or a\n  handle something else calls methods on. **`selectPanel`** says *\"open this now\"*. Reaching into\n  another panel's `values` by a well-known id to poke a counter is none of these and is already\n  forbidden two sections up; emit instead.\n- **Events are temporal, and that is what makes them safe.** A panel that was not mounted for one\n  reads fresh when it mounts, so `emit` after `selectPanel` covers both the panel that was\n  already open and the one just spawned — no second config write for the not-yet-mounted case.\n- **The mobile drawer is mobile-only, and its state is local.** `WorkbenchMobile` owns one\n  `useState` boolean and renders `WorkbenchMobileDrawer` itself; the shell does not. Nothing\n  outside that view can open it, so it has no representation in the layout store — don't add\n  one back. It does one thing: pick a panel. Rename, move, and close are desktop affordances\n  (tab context menu, drag, tab close button); mobile deliberately has no per-panel menu.\n- **`canRename` gates user affordances only** (double-click, F2, context menu). Programmatic\n  `renamePanel`/`rename` always works — a host's dirty `*` marker depends on it.\n- **The host owns persistence; the dock owns nothing.** `<Workbench snapshot>` is what to open\n  with — whatever the host restored — and it comes back through two props. `onChange` fires\n  whenever the arrangement moves; `onUnmount` fires once, on unmount, and React runs no cleanup\n  for a refresh or a closed tab, so on its own it means \"written when the user navigates away\".\n  Both are shell-scoped: a dock written to while its shell is unmounted sees those changes at the\n  next one that fires. **Don't pass `onChange` alongside a `snapshot` whose identity changes** —\n  the re-apply is reported back as a change and overwrites what the host just switched to.\n- **The `onChange` gate is field identity, in `use-workbench-life-cycle.ts`.** `commit` spreads the\n  previous slice before its patch, and every transient write (`measureSlots`, `setPanelValue`,\n  `setDragging`, `setEditingPanel`, `markComponentReady`) is a plain `set` touching one field no\n  snapshot holds — so comparing `tree`/`borders`/`panels`/`selection.panel`/`maximizedTabsetId`/\n  `recentCommands` by reference is exact. Route a transient write through `commit` to \"tidy up\"\n  and you start persisting it sixty times a second; `use-workbench-life-cycle.test.tsx` pins that.\n- **`loadSnapshot` applies once per `snapshot` identity**, so keep it a module-scope (or\n  memoized) constant: a host whose store outlives its shell would otherwise re-apply a restored\n  arrangement on every remount, dropping panels opened in between.\n- **Panel type ids are host data, and the snapshot format is a contract.** `WorkbenchPanelType`\n  is `string`; the core never enumerates ids. A record whose type is not registered survives as a\n  \"no component registered\" placeholder rather than being dropped — changing a panel-id *string*\n  turns every cached instance of it into one. A `WorkbenchSnapshot` also carries `recentCommands`,\n  so the palette's recents version with the arrangement. Hosts name their own cache entries and\n  carry the version in that name.\n- **`WorkbenchSide` is a *physical* side, so some classes are physical on purpose.** A host names\n  its borders `left`/`right`/`top`/`bottom` and gets that side. So `BODY_ROUND`\n  (`components/dock/workbench-border.tsx`) and `BORDER_GUTTER` (`components/dock/workbench-resizer.tsx`) are keyed by that side and\n  use `border-l` / `left-full` correctly — converting them to logical would mirror a border's\n  rounding away from the border in RTL. `RAIL_TAB_TURN`'s `left-1/2` is likewise correct: it pairs\n  with `-translate-x-1/2`, and both are physical, so the centring is self-consistent. Everything\n  *else* — spacing, alignment, auto-margins — must be logical (`ms-`, `ps-`, `text-start`).\n  A host that wants its rail on the other side in RTL moves the panel to the other border; the dock\n  does not mirror itself.\n- **Every host must `@import \"@semoss/workbench/globals.css\"`.** Tailwind only generates classes\n  it has scanned, and this package sits outside a host's own `@source` globs — without that import\n  the dock renders unstyled, with no build error anywhere.\n- **Chrome buttons come from `WorkbenchChromeButton`.** The Tooltip-around-a-ghost-Button at\n  `chromeButton`/`chromeIcon` size, muted until hovered, was hand-written in every control and\n  drifted on `aria-label` and `disabled` in most of them. Every panel control now uses it; a\n  new one that writes its own `Tooltip` is a regression. A control that is not a button — a\n  select, a dialog trigger, or one that needs the click event itself — still composes its own,\n  and so does the shell's own chrome (tabs, rails, border slots), which is not a panel control.\n- **The dock has no identity field.** It used to carry one, which quietly meant two things at\n  once: where a layout was stored, and which workbench the server thought a conversation belonged\n  to. Both are the host's to name now — a client shell builds one id and uses it for its cache\n  name and for `useAssistantStore(id)`, and that second use reaches the server, so changing what\n  a workbench passes orphans its conversation history.\n- **readOnly** blocks structural edits (move/split/pin/user-rename/reset) at the store level\n  and hides their affordances; navigation, opening files, and closing closable panels still\n  work, and the instance still persists under its own id.\n\n## Known design deviation\n\n`components/dock/workbench-stage.tsx` (the click-to-minimize backdrop) and\n`components/shell/workbench.tsx` (the busy scrim) use `bg-black/50`, which trips DESIGN.md's\n\"opacity on raw colors\" rule, and no enumerated carve-out covers a hand-rolled scrim.\n\nIt is deliberate: `bg-black/50` is exactly what `libs/ui`'s own `Dialog` and `Drawer` overlays\nuse, so this keeps the dock's backdrop identical to every modal in the app. The prescribed\nreplacement, `bg-background/50`, is a near-white wash in light mode — it fogs rather than dims,\nand it would make the workbench the one surface whose scrim looks different.\n\nNeither site can adopt a lib overlay component: the stage backdrop is a click-catcher inside\nthe dock, not a focus-trapping modal, and the busy scrim is a spinner over content. The real\nfix may require a shared scrim token in `globals.css` that both `libs/ui` and this package read.\nThis is known debt, not a package-level exemption: follow [DESIGN.md](../../DESIGN.md)\nwhen touching these sites, and report a token migration that requires wider scope rather\nthan silently expanding the change or claiming compliance.\n\n## Validation\n\nThis package is source-only; it has no build script. From the repository root:\n\n```bash\npnpm --filter @semoss/workbench check-types\npnpm --filter @semoss/workbench test\n```\n\n## Be cautious with\n\n- `stores/workbench.store.ts` and `components/shell/workbench.tsx` — shared by every consumer.\n- **Mount policy** — re-read the \"read this twice\" note above before changing a blueprint's.\n- **Control re-render semantics** — likewise. A control does not re-render with its panel.\n"}}}, {"item_id": "c2a8b12", "practice": false, "task": "Make a small behaviour change in `libs/ui/vite.config.ts`.", "target_path": "libs/ui/vite.config.ts", "repo": "SEMOSS/semoss-ui", "commit": "535fc9a41111c739473142cebf1872b8980619ed", "packet": {"agents_paths": ["AGENTS.md", "libs/connectors/AGENTS.md", "libs/i18n/AGENTS.md", "libs/panels/AGENTS.md", "libs/renderer/AGENTS.md", "libs/sdk/AGENTS.md", "libs/shared/AGENTS.md", "libs/ui/AGENTS.md", "libs/utility/AGENTS.md", "libs/workbench/AGENTS.md", "packages/auditlog/AGENTS.md", "packages/automation/AGENTS.md", "packages/browser-automation/AGENTS.md", "packages/cli/AGENTS.md", "packages/client/AGENTS.md", "packages/playground/AGENTS.md", "packages/terminal/AGENTS.md"], "rule_1": {"path": "AGENTS.md", "start_line": 209, "end_line": 211, "heading": "Rules", "text": "- **Keep PPTX viewer content lazy-loaded internally.** The manifest exposes only the root,\n  `globals.css`, and `vite` entry points, not a `file-pptx-view-content` public subpath.\n  Do not turn the heavy viewer into an eager public-barrel import.", "section_first_line": 207, "section_last_line": 211, "section_text": "## Rules\n\n- **Keep PPTX viewer content lazy-loaded internally.** The manifest exposes only the root,\n  `globals.css`, and `vite` entry points, not a `file-pptx-view-content` public subpath.\n  Do not turn the heavy viewer into an eager public-barrel import."}, "rule_2": {"path": "libs/ui/AGENTS.md", "start_line": 64, "end_line": 66, "heading": "AGENTS.md - @semoss/ui Component Library > Design Tokens (`src/styles/globals.css`) > `src/next/theme.ts` is dead code — never use it", "text": "`src/next/theme.ts` exports a MUI-shaped `lightTheme`/`darkTheme` palette whose values\ncontradict `globals.css`. It has zero consumers. Never import, extend, or treat it as a token\nsource. Deleting it is planned future work.", "section_first_line": 62, "section_last_line": 66, "section_text": "### `src/next/theme.ts` is dead code — never use it\n\n`src/next/theme.ts` exports a MUI-shaped `lightTheme`/`darkTheme` palette whose values\ncontradict `globals.css`. It has zero consumers. Never import, extend, or treat it as a token\nsource. Deleting it is planned future work."}, "scope_statements": [{"path": "AGENTS.md", "line": 1, "text": "# AGENTS.md - SEMOSS Monorepo"}, {"path": "AGENTS.md", "line": 30, "text": "Read the owning package's `AGENTS.md` and use the [skill index](./skills/README.md)"}, {"path": "AGENTS.md", "line": 81, "text": "[libs/panels/AGENTS.md](./libs/panels/AGENTS.md#what-a-host-has-to-wire-up)."}, {"path": "AGENTS.md", "line": 85, "text": "[libs/connectors/AGENTS.md](./libs/connectors/AGENTS.md#what-a-host-has-to-wire-up)."}, {"path": "AGENTS.md", "line": 140, "text": "See [DESIGN.md](./DESIGN.md) and the [UI component catalog](./libs/ui/AGENTS.md)."}, {"path": "AGENTS.md", "line": 159, "text": "for imports within a package. See [the utility guide](./libs/utility/AGENTS.md)."}, {"path": "AGENTS.md", "line": 160, "text": "- Search individual files, nested functions, callbacks, and repeated expressions as"}, {"path": "AGENTS.md", "line": 174, "text": "- **`*.local`** files - Local environment overrides (gitignored)"}, {"path": "AGENTS.md", "line": 185, "text": "## Nested AGENTS.md
