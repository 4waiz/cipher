[project]
name = "cipher"
version = "0.1.0"
description = "CIPHER: Contextual Instruction Precedence and Hierarchy Evaluation for Repositories"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT (code); see LICENSE and DATA_LICENSE.md" }
authors = [
  { name = "Awaiz Ahmed" },
  { name = "Mohammad Umar" },
  { name = "Huda Mueen" },
]
dependencies = [
  "pydantic==2.13.4",
  "requests==2.34.2",
  "numpy==2.4.6",
  "matplotlib==3.11.0",
  "pymupdf==1.28.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cipher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
